<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zombie Siege Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #14161c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #damageVignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 0 rgba(180,0,0,0);
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(180,0,0,0) 55%, rgba(180,0,0,0.55) 100%);
  }
  #damageVignette.hit {
    animation: damageFlash 350ms ease-out;
  }
  @keyframes damageFlash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  #critVignette {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(140,0,0,0) 45%, rgba(140,0,0,0.5) 100%);
  }
  #critVignette.active {
    animation: critPulse 1100ms ease-in-out infinite;
  }
  @keyframes critPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.65; }
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 2px rgba(0,0,0,0.7);
  }
  #crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-1px); }
  #crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
  #crosshair.hit {
    animation: crosshairPop 180ms ease-out;
  }
  #crosshair.hit::before, #crosshair.hit::after { background: #7cff5e; }
  @keyframes crosshairPop {
    0% { transform: translate(-50%, -50%) scale(1.8); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #muzzleFlash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 260px;
    height: 260px;
    margin-left: -130px;
    margin-top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,235,150,0.55) 0%, rgba(255,180,60,0.25) 35%, rgba(255,180,60,0) 70%);
    opacity: 0;
  }
  #muzzleFlash.flash {
    animation: muzzleFlashAnim 100ms ease-out;
  }
  @keyframes muzzleFlashAnim {
    0% { opacity: 1; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  .scorePop {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #7cff5e;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: scorePopAnim 600ms ease-out forwards;
  }
  @keyframes scorePopAnim {
    0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    100% { opacity: 0; transform: translate(-50%, -90px) translateY(0); }
  }

  .wavePop {
    position: absolute;
    left: 50%;
    top: 34%;
    transform: translate(-50%, -50%);
    color: #ff5e5e;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: wavePopAnim 1600ms ease-out forwards;
  }
  @keyframes wavePopAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  .bigPop {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: bigPopAnim 900ms ease-out forwards;
  }
  @keyframes bigPopAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    35% { transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
  }

  #joystick {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto;
    touch-action: none;
  }
  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(255,255,255,0.8);
  }

  #lookPad {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 55%;
    height: 65%;
    pointer-events: auto;
    touch-action: none;
  }

  #shootBtn {
    position: absolute;
    right: 30px;
    bottom: 150px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(60, 160, 40, 0.55);
    border: 3px solid rgba(255,255,255,0.75);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 80ms linear;
  }

  #jumpBtn {
    position: absolute;
    left: 150px;
    bottom: 40px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }

  #topBar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 190px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 15px;
    font-weight: 600;
  }
  #topBarRow {
    display: flex;
    justify-content: space-between;
  }
  #healthBarOuter {
    width: 100%;
    max-width: 220px;
    height: 14px;
    border-radius: 7px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.4);
    overflow: hidden;
  }
  #healthBarInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #6fd94a, #9bff5e);
    transition: width 150ms linear, background 150ms linear;
  }

  #hint {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 12px;
    text-align: center;
    max-width: 80%;
  }

  #gameNav {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    max-width: 170px;
    pointer-events: auto;
  }
  .navLink, .navCurrent {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 4px 7px;
  }
  .navCurrent {
    background: rgba(255,255,255,0.28);
    font-weight: 700;
  }

  #endScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    z-index: 50;
    pointer-events: auto;
    text-align: center;
    padding: 20px;
  }
  #endScreen h1 { font-size: 28px; margin: 0 0 8px; color: #ff5e5e; }
  #endScreen p { font-size: 16px; margin: 4px 0; opacity: 0.85; }
  #restartBtn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #4caf50;
    color: #fff;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #14161c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    z-index: 100;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="loading">Loading graveyard...</div>

<div id="hud">
  <div id="damageVignette"></div>
  <div id="critVignette"></div>
  <div id="crosshair"></div>
  <div id="muzzleFlash"></div>
  <div id="topBar">
    <div id="topBarRow">
      <div id="scoreLabel">Score: 0</div>
      <div id="waveLabel">Wave: 1</div>
    </div>
    <div id="healthBarOuter"><div id="healthBarInner"></div></div>
  </div>
  <div id="hint">Left pad: move &middot; Right side: look &middot; &uarr;: jump &middot; Green button: shoot</div>
  <div id="gameNav">
    <a class="navLink" href="index.html">Builder</a>
    <a class="navLink" href="fps.html">Range</a>
    <a class="navLink" href="powers.html">Powers</a>
    <span class="navCurrent">Zombies</span>
  </div>

  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookPad"></div>
  <div id="jumpBtn">&#8593;</div>
  <div id="shootBtn">SHOOT</div>
</div>

<div id="endScreen">
  <h1>You died</h1>
  <p id="finalScore">Final score: 0</p>
  <p id="finalWave">Reached wave: 1</p>
  <p id="finalKills">Zombies killed: 0</p>
  <button id="restartBtn">Play again</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  var GRAVITY = -18;
  var JUMP_SPEED = 6.5;
  var MOVE_SPEED = 5;
  var PLAYER_HEIGHT = 1.7;
  var ARENA_HALF = 22;
  var SHOOT_RANGE = 60;
  var ZOMBIE_PUNCH_DURATION = 0.18;
  var FIRE_COOLDOWN = 0.28;
  var BOB_FREQUENCY = 9;
  var BOB_AMOUNT = 0.045;
  var PLAYER_MAX_HEALTH = 100;
  var ZOMBIE_HP = 30;
  var ZOMBIE_DAMAGE_PER_HIT = 15;
  var ZOMBIE_ATTACK_RANGE = 1.3;
  var ZOMBIE_ATTACK_DAMAGE = 8;
  var ZOMBIE_ATTACK_COOLDOWN = 0.9;
  var ZOMBIE_BASE_SPEED = 1.5;
  var ZOMBIE_BASE_COUNT = 4;
  var WAVE_ANNOUNCE_DELAY = 1400;
  var HEADSHOT_MULT = 3;
  var ZOMBIE_FALL_DURATION = 0.55;
  var GORE_LINGER = 0.35;
  var BLOOD_POOL_POOL_SIZE = 26;
  var GIB_POOL_SIZE = 34;
  var COMBO_WINDOW = 1.3;
  var BLEED_INTERVAL = 1.1;
  var DISMEMBER_CHANCE = 0.45;

  // Per-type stat multipliers and body proportions, applied on top of the base zombie stats.
  var ZOMBIE_TYPES = {
    walker: { hpMult: 1, speedMult: 1, dmgMult: 1, scale: 1, score: 25, minWave: 1, bodyWidthMult: 1, legLenMult: 1, ranged: false },
    runner: { hpMult: 0.55, speedMult: 1.9, dmgMult: 0.8, scale: 0.92, score: 30, minWave: 1, bodyWidthMult: 0.8, legLenMult: 1.12, ranged: false },
    spitter: { hpMult: 0.8, speedMult: 0.85, dmgMult: 1, scale: 1.05, score: 35, minWave: 2, bodyWidthMult: 1.35, legLenMult: 0.92, ranged: true },
    brute: { hpMult: 3, speedMult: 0.68, dmgMult: 1.9, scale: 1.4, score: 75, minWave: 3, bodyWidthMult: 1.25, legLenMult: 1, ranged: false }
  };
  var SPITTER_RANGE = 11;
  var SPITTER_COOLDOWN = 2.6;
  var SPIT_SPEED = 9;
  var SPIT_DAMAGE = 10;

  // ---------- Sound (synthesized, no audio files) ----------
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, freqEnd, duration, type, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playNoiseBurst(duration, filterFreq, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.value = volume;
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

  function sfxShoot() { playNoiseBurst(0.07, 2200, 0.22); playTone(160, 70, 0.09, "square", 0.14); }
  function sfxHit() { playTone(500, 220, 0.09, "sawtooth", 0.15); }
  function sfxZombieDie() { playTone(300, 60, 0.3, "sawtooth", 0.16); playNoiseBurst(0.2, 900, 0.15); }
  function sfxPlayerHurt() { playTone(180, 90, 0.18, "square", 0.2); }
  function sfxJump() { playTone(260, 480, 0.16, "sine", 0.16); }
  function sfxWave() { playTone(200, 500, 0.5, "sine", 0.18); }
  function sfxGameOver() { playTone(300, 60, 1.0, "sawtooth", 0.2); }
  function sfxGroan() { playTone(90 + Math.random() * 40, 50, 0.4, "sawtooth", 0.05); }
  function sfxHeadshot() { playTone(900, 200, 0.12, "square", 0.18); playNoiseBurst(0.15, 700, 0.18); }
  function sfxSquelch() { playNoiseBurst(0.12, 500, 0.16); playTone(140, 40, 0.14, "sawtooth", 0.1); }
  function sfxCombo() { playTone(700, 1100, 0.14, "sine", 0.18); }
  function sfxSpit() { playTone(320, 180, 0.16, "sawtooth", 0.14); playNoiseBurst(0.1, 1400, 0.1); }
  function sfxSplat() { playNoiseBurst(0.16, 400, 0.16); playTone(120, 40, 0.16, "sawtooth", 0.1); }

  // ---------- Scene setup ----------
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b2230);
  scene.fog = new THREE.Fog(0x1b2230, 18, 55);

  var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
  scene.add(camera);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var hemi = new THREE.HemisphereLight(0x8899cc, 0x1a1d24, 0.55);
  scene.add(hemi);
  var moon = new THREE.DirectionalLight(0xaebfff, 0.85);
  moon.position.set(-15, 30, -10);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.left = -ARENA_HALF - 5;
  moon.shadow.camera.right = ARENA_HALF + 5;
  moon.shadow.camera.top = ARENA_HALF + 5;
  moon.shadow.camera.bottom = -ARENA_HALF - 5;
  moon.shadow.camera.near = 1;
  moon.shadow.camera.far = 100;
  moon.shadow.bias = -0.002;
  scene.add(moon);

  // ---------- Procedural textures (no external assets) ----------
  function makeCanvasTexture(size, draw) {
    var canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    draw(canvas.getContext("2d"), size);
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  var groundTexture = makeCanvasTexture(256, function (ctx, size) {
    ctx.fillStyle = "#3a3f33";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 2;
    var cell = size / 8;
    for (var i = 0; i <= 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, size);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cell);
      ctx.lineTo(size, i * cell);
      ctx.stroke();
    }
    for (var s = 0; s < 500; s++) {
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
    }
  });
  groundTexture.repeat.set(ARENA_HALF / 2, ARENA_HALF / 2);

  var wallTexture = makeCanvasTexture(128, function (ctx, size) {
    ctx.fillStyle = "#444a52";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    ctx.lineWidth = 3;
    for (var i = 0; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * (size / 4));
      ctx.lineTo(size, i * (size / 4));
      ctx.stroke();
    }
  });
  wallTexture.repeat.set(4, 1.5);

  var crateTexture = makeCanvasTexture(128, function (ctx, size) {
    ctx.fillStyle = "#5a4630";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 4;
    ctx.strokeRect(6, 6, size - 12, size - 12);
    ctx.beginPath();
    ctx.moveTo(6, 6);
    ctx.lineTo(size - 6, size - 6);
    ctx.moveTo(size - 6, 6);
    ctx.lineTo(6, size - 6);
    ctx.stroke();
  });

  // ---------- Arena ----------
  var groundGeo = new THREE.PlaneGeometry(ARENA_HALF * 2, ARENA_HALF * 2);
  var groundMat = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.95, metalness: 0 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  var obstacles = [ground];

  var wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.9, metalness: 0.05 });
  var wallHeight = 6;
  var wallThickness = 1;
  function addWall(x, z, w, d) {
    var geo = new THREE.BoxGeometry(w, wallHeight, d);
    var mesh = new THREE.Mesh(geo, wallMat);
    mesh.position.set(x, wallHeight / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push(mesh);
  }
  addWall(0, -ARENA_HALF, ARENA_HALF * 2 + wallThickness, wallThickness);
  addWall(0, ARENA_HALF, ARENA_HALF * 2 + wallThickness, wallThickness);
  addWall(-ARENA_HALF, 0, wallThickness, ARENA_HALF * 2 + wallThickness);
  addWall(ARENA_HALF, 0, wallThickness, ARENA_HALF * 2 + wallThickness);

  // a few crate obstacles for visual interest
  var crateMat = new THREE.MeshStandardMaterial({ map: crateTexture, roughness: 0.85, metalness: 0 });
  var crateSpots = [[-8, -4], [6, 5], [-3, 10], [10, -9], [-12, 12], [13, 3]];
  crateSpots.forEach(function (p) {
    var crate = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), crateMat);
    crate.position.set(p[0], 1, p[1]);
    crate.castShadow = true;
    crate.receiveShadow = true;
    scene.add(crate);
    obstacles.push(crate);
  });

  // ---------- Zombies: shambling humanoids ----------
  var zombies = []; // { group, hp, maxHp, parts, speed, attackCooldown, dead, punch, groanTimer }
  var zombieHitMeshes = [];

  function hexToCss(hex) { return "#" + ("000000" + hex.toString(16)).slice(-6); }

  // Mottled, decayed skin with dark bruises and old wound streaks.
  function makeSkinTexture(baseHex) {
    return makeCanvasTexture(64, function (ctx, size) {
      ctx.fillStyle = hexToCss(baseHex);
      ctx.fillRect(0, 0, size, size);
      for (var i = 0; i < 22; i++) {
        ctx.fillStyle = "rgba(0,0,0," + (0.05 + Math.random() * 0.14) + ")";
        ctx.beginPath();
        ctx.arc(Math.random() * size, Math.random() * size, 2 + Math.random() * 6, 0, Math.PI * 2);
        ctx.fill();
      }
      for (var j = 0; j < 5; j++) {
        ctx.strokeStyle = "rgba(110,10,10," + (0.35 + Math.random() * 0.35) + ")";
        ctx.lineWidth = 1 + Math.random() * 1.5;
        var sx = Math.random() * size, sy = Math.random() * size;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (Math.random() * 12 - 6), sy + Math.random() * 14 + 3);
        ctx.stroke();
      }
    });
  }

  // Torn, blood-stained clothing.
  function makeShirtTexture(baseHex) {
    return makeCanvasTexture(64, function (ctx, size) {
      ctx.fillStyle = hexToCss(baseHex);
      ctx.fillRect(0, 0, size, size);
      for (var i = 0; i < 5; i++) {
        var cx = Math.random() * size, cy = Math.random() * size;
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        for (var k = 0; k < 5; k++) ctx.lineTo(cx + (Math.random() * 16 - 8), cy + (Math.random() * 16 - 8));
        ctx.closePath();
        ctx.fill();
      }
      for (var b = 0; b < 4; b++) {
        var bx = Math.random() * size, by = Math.random() * size, r = 4 + Math.random() * 11;
        var grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
        grad.addColorStop(0, "rgba(100,10,10,0.85)");
        grad.addColorStop(1, "rgba(100,10,10,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  var TYPE_SKIN_COLOR = { walker: 0x5a7a4a, runner: 0x8a9a63, spitter: 0x93a83c, brute: 0x6e2a24 };
  var TYPE_SHIRT_COLOR = { walker: 0x3f3a35, runner: 0x33413a, spitter: 0x4a4a2a, brute: 0x2c1512 };
  var skinTexByType = {};
  var shirtTexByType = {};
  Object.keys(ZOMBIE_TYPES).forEach(function (t) {
    skinTexByType[t] = makeSkinTexture(TYPE_SKIN_COLOR[t]);
    shirtTexByType[t] = makeShirtTexture(TYPE_SHIRT_COLOR[t]);
  });

  function randomEdgeSpawn() {
    var margin = 1.5;
    var side = Math.floor(Math.random() * 4);
    var x, z;
    if (side === 0) { x = -ARENA_HALF + margin; z = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else if (side === 1) { x = ARENA_HALF - margin; z = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else if (side === 2) { z = -ARENA_HALF + margin; x = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else { z = ARENA_HALF - margin; x = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    return new THREE.Vector3(x, 0, z);
  }

  function createZombie(type) {
    var cfg = ZOMBIE_TYPES[type];
    var wMult = cfg.bodyWidthMult;
    var lMult = cfg.legLenMult;

    var group = new THREE.Group();
    var skinMat = new THREE.MeshStandardMaterial({ map: skinTexByType[type], roughness: 0.9 });
    var shirtMat = new THREE.MeshStandardMaterial({ map: shirtTexByType[type], roughness: 0.85 });
    var pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b2c26, roughness: 0.85 });

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), skinMat);
    head.position.y = 1.5;
    head.rotation.x = type === "runner" ? 0.05 : 0.25; // runners hold their head up, hunting for prey

    var torso = new THREE.Mesh(new THREE.BoxGeometry(0.6 * wMult, 0.72, 0.32 * wMult), shirtMat);
    torso.position.y = 0.98;
    torso.rotation.x = type === "runner" ? -0.05 : 0.12; // hunched, except runners lean forward to sprint

    var hips = new THREE.Mesh(new THREE.BoxGeometry(0.48 * wMult, 0.34, 0.3 * wMult), pantsMat);
    hips.position.y = 0.46;

    var legGeo = new THREE.BoxGeometry(0.2, 0.85 * lMult, 0.24);
    var legL = new THREE.Mesh(legGeo, pantsMat);
    legL.position.set(-0.15, -0.05, 0);
    var legR = new THREE.Mesh(legGeo, pantsMat);
    legR.position.set(0.15, -0.05, 0);

    // arms reach forward, classic zombie pose
    var armGeo = new THREE.BoxGeometry(0.17, 0.62, 0.19);
    var armL = new THREE.Mesh(armGeo, skinMat);
    armL.position.set(-0.4 * wMult, 1.02, -0.18);
    armL.rotation.x = -1.15;
    var armR = new THREE.Mesh(armGeo, skinMat);
    armR.position.set(0.4 * wMult, 1.02, -0.18);
    armR.rotation.x = -1.15;

    var parts = [head, torso, hips, legL, legR, armL, armR];

    if (type === "spitter") {
      // distended, bloated belly sac used to lob projectiles
      var belly = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), skinMat);
      belly.scale.set(1, 0.85, 0.9);
      belly.position.set(0, 0.78, 0.12);
      parts.push(belly);
    }

    parts.forEach(function (part) {
      part.castShadow = true;
      part.receiveShadow = true;
      group.add(part);
      part.userData.rootZombie = group;
      zombieHitMeshes.push(part);
    });

    group.scale.setScalar(cfg.scale);

    group.userData.parts = parts;
    group.userData.head = head;
    return group;
  }

  var zombiesKilled = 0;
  var wave = 1;
  var zombiesAliveInWave = 0;
  var waveTransitioning = false;
  var comboCount = 0;
  var comboTimer = 0;

  function pickZombieType(n) {
    var options = [{ type: "walker", w: 45 }];
    if (n >= ZOMBIE_TYPES.runner.minWave) options.push({ type: "runner", w: Math.min(30, 12 + n * 3) });
    if (n >= ZOMBIE_TYPES.spitter.minWave) options.push({ type: "spitter", w: Math.min(28, 10 + (n - 1) * 3) });
    if (n >= ZOMBIE_TYPES.brute.minWave) options.push({ type: "brute", w: Math.min(30, 8 + (n - 2) * 4) });
    var total = options.reduce(function (s, o) { return s + o.w; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < options.length; i++) {
      r -= options[i].w;
      if (r <= 0) return options[i].type;
    }
    return "walker";
  }

  function spawnZombie(speedMult, forceType) {
    var type = forceType || pickZombieType(wave);
    var cfg = ZOMBIE_TYPES[type];
    var group = createZombie(type);
    group.position.copy(randomEdgeSpawn());
    group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(group);
    var z = {
      group: group,
      type: type,
      cfg: cfg,
      hp: Math.round(ZOMBIE_HP * cfg.hpMult),
      maxHp: Math.round(ZOMBIE_HP * cfg.hpMult),
      speed: ZOMBIE_BASE_SPEED * speedMult * cfg.speedMult * (0.85 + Math.random() * 0.3),
      attackCooldown: 0,
      attackDamage: Math.round(ZOMBIE_ATTACK_DAMAGE * cfg.dmgMult),
      dead: false,
      punch: 0,
      groanTimer: 2 + Math.random() * 4,
      bleedTimer: 0,
      bobPhase: Math.random() * Math.PI * 2,
      isBrute: type === "brute",
      headMesh: group.userData.head,
      fallElapsed: 0
    };
    zombies.push(z);
    zombiesAliveInWave++;
    return z;
  }

  function startWave(n) {
    wave = n;
    waveLabel.textContent = "Wave: " + wave;
    var count = Math.min(ZOMBIE_BASE_COUNT + (wave - 1) * 2, 18);
    var speedMult = 1 + (wave - 1) * 0.06;
    for (var i = 0; i < count; i++) spawnZombie(speedMult);
    showWavePop("WAVE " + wave, "#ff5e5e");
    sfxWave();
  }

  function showWavePop(text, color) {
    var el = document.createElement("div");
    el.className = "wavePop";
    if (color) el.style.color = color;
    el.textContent = text;
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 1650);
  }

  function showBigPop(text, color) {
    var el = document.createElement("div");
    el.className = "bigPop";
    el.style.color = color || "#ff8a4a";
    el.textContent = text;
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 950);
  }

  function removeZombie(z) {
    scene.remove(z.group);
    var idx = zombies.indexOf(z);
    if (idx >= 0) zombies.splice(idx, 1);
  }

  function detachZombieHitbox(z) {
    var hidx;
    z.group.userData.parts.forEach(function (part) {
      hidx = zombieHitMeshes.indexOf(part);
      if (hidx >= 0) zombieHitMeshes.splice(hidx, 1);
    });
  }

  function killZombie(z, headshot) {
    if (z.dead) return;
    z.dead = true;
    z.fallElapsed = 0;
    detachZombieHitbox(z);
    zombiesKilled++;
    zombiesAliveInWave--;

    var points = z.cfg.score + (headshot ? 15 : 0);
    score += points;
    scoreLabel.textContent = "Score: " + score;
    sfxZombieDie();
    sfxSplat();

    var deathPos = z.group.position.clone();
    deathPos.y = 0.02;
    spawnBloodPool(deathPos, z.cfg.scale * 1.15);
    spawnGibs(z.group.position.clone().setY(0.9 * z.cfg.scale), z.cfg.scale);
    if (headshot || Math.random() < DISMEMBER_CHANCE) {
      spawnHeadGib(z.group.position.clone().setY(1.5 * z.cfg.scale), z.cfg.scale, TYPE_SKIN_COLOR[z.type]);
    }

    comboCount++;
    comboTimer = COMBO_WINDOW;
    if (comboCount >= 2) {
      var label = comboCount === 2 ? "DOUBLE KILL" : comboCount === 3 ? "TRIPLE KILL" : comboCount + "x COMBO";
      showBigPop(label, "#ffd23f");
      sfxCombo();
    }

    setTimeout(function () { removeZombie(z); }, ZOMBIE_FALL_DURATION * 1000 + GORE_LINGER * 1000);

    if (zombiesAliveInWave <= 0 && !waveTransitioning && !gameOver) {
      waveTransitioning = true;
      setTimeout(function () {
        waveTransitioning = false;
        if (!gameOver) startWave(wave + 1);
      }, WAVE_ANNOUNCE_DELAY);
    }
  }

  // ---------- Player physics ----------
  var player = {
    pos: new THREE.Vector3(0, PLAYER_HEIGHT, 0),
    vy: 0,
    grounded: true,
    yaw: 0,
    pitch: -0.05,
    health: PLAYER_MAX_HEALTH
  };
  var wantJump = false;
  var bobPhase = 0;

  function clampToArena(pos) {
    var margin = 0.8;
    pos.x = Math.max(-ARENA_HALF + margin, Math.min(ARENA_HALF - margin, pos.x));
    pos.z = Math.max(-ARENA_HALF + margin, Math.min(ARENA_HALF - margin, pos.z));
  }

  // ---------- Input: joystick ----------
  var joystickEl = document.getElementById("joystick");
  var joystickKnob = document.getElementById("joystickKnob");
  var moveVec = { x: 0, y: 0 };
  var joystickTouchId = null;
  var joystickCenter = { x: 0, y: 0 };
  var JOYSTICK_MAX = 40;

  function joystickStart(id, clientX, clientY) {
    joystickTouchId = id;
    var rect = joystickEl.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    joystickMove(clientX, clientY);
  }
  function joystickMove(clientX, clientY) {
    var dx = clientX - joystickCenter.x;
    var dy = clientY - joystickCenter.y;
    var dist = Math.min(JOYSTICK_MAX, Math.sqrt(dx * dx + dy * dy));
    var angle = Math.atan2(dy, dx);
    var kx = Math.cos(angle) * dist;
    var ky = Math.sin(angle) * dist;
    joystickKnob.style.transform = "translate(" + kx + "px," + ky + "px)";
    moveVec.x = kx / JOYSTICK_MAX;
    moveVec.y = ky / JOYSTICK_MAX;
  }
  function joystickEnd() {
    joystickTouchId = null;
    moveVec.x = 0; moveVec.y = 0;
    joystickKnob.style.transform = "translate(0,0)";
  }

  joystickEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joystickStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  joystickEl.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) joystickMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  joystickEl.addEventListener("touchend", function (e) { e.preventDefault(); joystickEnd(); }, { passive: false });
  joystickEl.addEventListener("touchcancel", joystickEnd);

  var mouseJoystickDown = false;
  joystickEl.addEventListener("mousedown", function (e) {
    mouseJoystickDown = true;
    joystickStart("mouse", e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", function (e) {
    if (mouseJoystickDown) joystickMove(e.clientX, e.clientY);
    if (lookDown) lookMove(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", function () {
    if (mouseJoystickDown) { mouseJoystickDown = false; joystickEnd(); }
    lookDown = false;
  });

  // ---------- Input: look pad ----------
  var lookPad = document.getElementById("lookPad");
  var lookTouchId = null;
  var lookDown = false;
  var lastLook = { x: 0, y: 0 };
  var LOOK_SENSITIVITY = 0.006;

  function lookStart(id, x, y) {
    lookDown = true;
    lookTouchId = id;
    lastLook.x = x; lastLook.y = y;
  }
  function lookMove(x, y) {
    var dx = x - lastLook.x;
    var dy = y - lastLook.y;
    lastLook.x = x; lastLook.y = y;
    player.yaw -= dx * LOOK_SENSITIVITY;
    player.pitch -= dy * LOOK_SENSITIVITY;
    var maxPitch = Math.PI / 2 - 0.05;
    player.pitch = Math.max(-maxPitch, Math.min(maxPitch, player.pitch));
  }

  lookPad.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    lookStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  lookPad.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === lookTouchId) lookMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  lookPad.addEventListener("touchend", function (e) {
    e.preventDefault();
    lookDown = false; lookTouchId = null;
  }, { passive: false });
  lookPad.addEventListener("mousedown", function (e) {
    lookStart("mouse", e.clientX, e.clientY);
  });

  // ---------- Gun viewmodel ----------
  var gunGroup = new THREE.Group();
  var gunBasePos = new THREE.Vector3(0.1, -0.27, -1.1);
  var gunBaseRotX = 0.02;
  gunGroup.position.copy(gunBasePos);
  gunGroup.rotation.x = gunBaseRotX;
  gunGroup.rotation.y = -0.12;
  camera.add(gunGroup);

  var gunMetalMat = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.4, metalness: 0.6 });
  var gunGripMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.1 });

  var gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.22), gunMetalMat);
  gunBody.position.set(0, 0, 0);
  gunGroup.add(gunBody);

  var gunBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.024, 0.12), gunMetalMat);
  gunBarrel.position.set(0, 0.01, -0.17);
  gunGroup.add(gunBarrel);

  var gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.11, 0.048), gunGripMat);
  gunGrip.position.set(0, -0.07, 0.06);
  gunGrip.rotation.x = 0.25;
  gunGroup.add(gunGrip);

  var gunSight = new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.016, 0.016), gunMetalMat);
  gunSight.position.set(0, 0.043, -0.05);
  gunGroup.add(gunSight);

  var recoilKick = 0;
  function triggerRecoil() {
    recoilKick = 1;
  }

  // ---------- VFX: tracers, impact particles, screen shake ----------
  var vfxGroup = new THREE.Group();
  scene.add(vfxGroup);

  var tracers = []; // { line, life, maxLife }
  var tracerMat = new THREE.LineBasicMaterial({ color: 0xd8ffb0, transparent: true, opacity: 0.9 });

  function spawnTracer(from, to) {
    var geo = new THREE.BufferGeometry().setFromPoints([from, to]);
    var line = new THREE.Line(geo, tracerMat.clone());
    vfxGroup.add(line);
    tracers.push({ line: line, life: 0.08, maxLife: 0.08 });
  }

  var PARTICLE_POOL_SIZE = 40;
  var particlePool = [];
  var particleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
  for (var pi = 0; pi < PARTICLE_POOL_SIZE; pi++) {
    var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    var pMesh = new THREE.Mesh(particleGeo, pMat);
    pMesh.visible = false;
    vfxGroup.add(pMesh);
    particlePool.push({ mesh: pMesh, vel: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextParticleIndex = 0;

  function spawnImpactBurst(position, color, count) {
    for (var n = 0; n < count; n++) {
      var p = particlePool[nextParticleIndex];
      nextParticleIndex = (nextParticleIndex + 1) % PARTICLE_POOL_SIZE;
      p.active = true;
      p.mesh.visible = true;
      p.mesh.position.copy(position);
      p.mesh.material.color.setHex(color);
      p.mesh.material.opacity = 1;
      var speed = 1.5 + Math.random() * 2.5;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI * 0.6;
      p.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed + 1,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      p.life = 0.35 + Math.random() * 0.25;
      p.maxLife = p.life;
    }
  }

  // ---------- Muzzle smoke ----------
  var SMOKE_POOL_SIZE = 18;
  var smokeGeo = new THREE.SphereGeometry(0.05, 6, 6);
  var smokePool = [];
  for (var smi = 0; smi < SMOKE_POOL_SIZE; smi++) {
    var smokeMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0 });
    var smokeMesh = new THREE.Mesh(smokeGeo, smokeMat);
    smokeMesh.visible = false;
    vfxGroup.add(smokeMesh);
    smokePool.push({ mesh: smokeMesh, vel: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextSmokeIndex = 0;

  function spawnMuzzleSmoke(position) {
    for (var n = 0; n < 3; n++) {
      var p = smokePool[nextSmokeIndex];
      nextSmokeIndex = (nextSmokeIndex + 1) % SMOKE_POOL_SIZE;
      p.active = true;
      p.mesh.visible = true;
      p.mesh.position.copy(position);
      p.mesh.position.x += (Math.random() - 0.5) * 0.05;
      p.mesh.position.y += (Math.random() - 0.5) * 0.05;
      p.mesh.scale.setScalar(0.6 + Math.random() * 0.4);
      p.mesh.material.opacity = 0.4;
      p.vel.set((Math.random() - 0.5) * 0.4, 0.7 + Math.random() * 0.4, (Math.random() - 0.5) * 0.4);
      p.life = 0.45 + Math.random() * 0.25;
      p.maxLife = p.life;
    }
  }

  function updateSmoke(dt) {
    for (var qi = 0; qi < smokePool.length; qi++) {
      var p = smokePool[qi];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) {
        p.active = false;
        p.mesh.visible = false;
        continue;
      }
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.scale.multiplyScalar(1 + dt * 1.6);
      p.mesh.material.opacity = Math.max(0, (p.life / p.maxLife) * 0.4);
    }
  }

  // ---------- Shell casings ----------
  var CASING_POOL_SIZE = 10;
  var casingGeo = new THREE.BoxGeometry(0.018, 0.05, 0.018);
  var casingPool = [];
  for (var cai = 0; cai < CASING_POOL_SIZE; cai++) {
    var casingMat = new THREE.MeshStandardMaterial({ color: 0xc9a23c, roughness: 0.35, metalness: 0.7, transparent: true });
    var casingMesh = new THREE.Mesh(casingGeo, casingMat);
    casingMesh.visible = false;
    scene.add(casingMesh);
    casingPool.push({ mesh: casingMesh, vel: new THREE.Vector3(), spin: new THREE.Vector3(), life: 0, active: false, settled: false });
  }
  var nextCasingIndex = 0;

  function spawnCasing() {
    var worldPos = new THREE.Vector3();
    gunGroup.getWorldPosition(worldPos);
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    var up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    var p = casingPool[nextCasingIndex];
    nextCasingIndex = (nextCasingIndex + 1) % CASING_POOL_SIZE;
    p.active = true;
    p.settled = false;
    p.mesh.visible = true;
    p.mesh.position.copy(worldPos);
    p.mesh.material.opacity = 1;
    p.vel.copy(right).multiplyScalar(1.4 + Math.random() * 1.2).addScaledVector(up, 1.1 + Math.random() * 0.6);
    p.spin.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
    p.life = 1.4;
  }

  function updateCasings(dt) {
    for (var qi = 0; qi < casingPool.length; qi++) {
      var p = casingPool[qi];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) {
        p.active = false;
        p.mesh.visible = false;
        continue;
      }
      if (!p.settled) {
        p.vel.y -= 14 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.rotation.x += p.spin.x * dt;
        p.mesh.rotation.y += p.spin.y * dt;
        p.mesh.rotation.z += p.spin.z * dt;
        if (p.mesh.position.y <= 0.02) {
          p.mesh.position.y = 0.02;
          p.settled = true;
        }
      }
      if (p.life < 0.4) p.mesh.material.opacity = p.life / 0.4;
    }
  }

  // ---------- Gore: blood pools + gibs ----------
  var bloodTexture = makeCanvasTexture(64, function (ctx, size) {
    ctx.clearRect(0, 0, size, size);
    var cx = size / 2, cy = size / 2;
    for (var b = 0; b < 7; b++) {
      var bx = cx + (Math.random() * 2 - 1) * size * 0.28;
      var by = cy + (Math.random() * 2 - 1) * size * 0.28;
      var r = size * (0.14 + Math.random() * 0.22);
      var grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      grad.addColorStop(0, "rgba(110,10,10,0.95)");
      grad.addColorStop(0.6, "rgba(90,6,6,0.7)");
      grad.addColorStop(1, "rgba(90,6,6,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  var bloodPoolGeo = new THREE.PlaneGeometry(1, 1);
  var bloodPoolPool = [];
  for (var bi = 0; bi < BLOOD_POOL_POOL_SIZE; bi++) {
    var bMat = new THREE.MeshBasicMaterial({ map: bloodTexture, transparent: true, opacity: 0, depthWrite: false });
    var bMesh = new THREE.Mesh(bloodPoolGeo, bMat);
    bMesh.rotation.x = -Math.PI / 2;

    scene.add(bMesh);
    bloodPoolPool.push(bMesh);
  }
  var nextBloodPoolIndex = 0;

  function spawnBloodPool(position, scale) {
    var mesh = bloodPoolPool[nextBloodPoolIndex];
    nextBloodPoolIndex = (nextBloodPoolIndex + 1) % BLOOD_POOL_POOL_SIZE;
    mesh.position.copy(position);
    mesh.rotation.z = Math.random() * Math.PI * 2;
    var s = (1.1 + Math.random() * 0.9) * scale;
    mesh.scale.set(s, s, s);
    mesh.material.opacity = 0.85;
    mesh.visible = true;
    return mesh;
  }

  var GIB_COLORS = [0x8a1414, 0x6b0f0f, 0xa32020];
  var gibGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
  var gibPool = [];
  for (var gi = 0; gi < GIB_POOL_SIZE; gi++) {
    var gMat = new THREE.MeshStandardMaterial({ color: GIB_COLORS[gi % GIB_COLORS.length], roughness: 0.7, transparent: true });
    var gMesh = new THREE.Mesh(gibGeo, gMat);
    gMesh.visible = false;
    gMesh.castShadow = true;
    scene.add(gMesh);
    gibPool.push({ mesh: gMesh, vel: new THREE.Vector3(), spin: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextGibIndex = 0;

  function spawnGibs(position, scale) {
    var count = Math.round(6 * scale);
    for (var n = 0; n < count; n++) {
      var g = gibPool[nextGibIndex];
      nextGibIndex = (nextGibIndex + 1) % GIB_POOL_SIZE;
      g.active = true;
      g.mesh.visible = true;
      g.mesh.position.copy(position);
      var scl = scale * (0.6 + Math.random() * 0.8);
      g.mesh.scale.setScalar(scl);
      g.mesh.material.opacity = 1;
      var speed = 2 + Math.random() * 3.5;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI * 0.55;
      g.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed + 1.5,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      g.spin.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
      g.life = 0.6 + Math.random() * 0.5;
      g.maxLife = g.life;
      g.settled = false;
    }
  }

  function updateGibs(dt) {
    for (var qi = 0; qi < gibPool.length; qi++) {
      var g = gibPool[qi];
      if (!g.active) continue;
      g.life -= dt;
      if (g.life <= 0) {
        g.active = false;
        g.mesh.visible = false;
        continue;
      }
      if (!g.settled) {
        g.vel.y -= 12 * dt;
        g.mesh.position.addScaledVector(g.vel, dt);
        g.mesh.rotation.x += g.spin.x * dt;
        g.mesh.rotation.y += g.spin.y * dt;
        g.mesh.rotation.z += g.spin.z * dt;
        if (g.mesh.position.y <= 0.05) {
          g.mesh.position.y = 0.05;
          g.settled = true;
        }
      }
      if (g.life < 0.25) g.mesh.material.opacity = g.life / 0.25;
    }
  }

  // Dismemberment: an occasional detached head flies off on kill (rare, one-off meshes).
  var headGibGeo = new THREE.SphereGeometry(0.22, 10, 10);
  var activeHeadGibs = [];

  function spawnHeadGib(position, scale, skinHex) {
    var mat = new THREE.MeshStandardMaterial({ color: skinHex, roughness: 0.9, transparent: true });
    var mesh = new THREE.Mesh(headGibGeo, mat);
    mesh.scale.setScalar(scale);
    mesh.position.copy(position);
    mesh.castShadow = true;
    scene.add(mesh);
    var speed = 3 + Math.random() * 2.5;
    var theta = Math.random() * Math.PI * 2;
    activeHeadGibs.push({
      mesh: mesh,
      vel: new THREE.Vector3(Math.cos(theta) * speed, 4.5 + Math.random() * 2, Math.sin(theta) * speed),
      spin: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
      life: 1.2,
      maxLife: 1.2,
      settled: false
    });
  }

  function updateHeadGibs(dt) {
    for (var i = activeHeadGibs.length - 1; i >= 0; i--) {
      var g = activeHeadGibs[i];
      g.life -= dt;
      if (g.life <= 0) {
        scene.remove(g.mesh);
        g.mesh.material.dispose();
        activeHeadGibs.splice(i, 1);
        continue;
      }
      if (!g.settled) {
        g.vel.y -= 12 * dt;
        g.mesh.position.addScaledVector(g.vel, dt);
        g.mesh.rotation.x += g.spin.x * dt;
        g.mesh.rotation.y += g.spin.y * dt;
        g.mesh.rotation.z += g.spin.z * dt;
        if (g.mesh.position.y <= 0.1) {
          g.mesh.position.y = 0.1;
          g.settled = true;
          spawnBloodPool(g.mesh.position.clone().setY(0.02), 0.6);
        }
      }
      if (g.life < 0.3) g.mesh.material.opacity = g.life / 0.3;
    }
  }

  // ---------- Ranged attacks (spitter acid globs) ----------
  var SPIT_POOL_SIZE = 12;
  var spitGeo = new THREE.SphereGeometry(0.09, 8, 8);
  var spitPool = [];
  for (var si = 0; si < SPIT_POOL_SIZE; si++) {
    var spitMat = new THREE.MeshBasicMaterial({ color: 0x9fe23a, transparent: true });
    var spitMesh = new THREE.Mesh(spitGeo, spitMat);
    spitMesh.visible = false;
    scene.add(spitMesh);
    spitPool.push({ mesh: spitMesh, vel: new THREE.Vector3(), life: 0, active: false });
  }
  var nextSpitIndex = 0;

  function spawnSpit(fromPos, targetPos) {
    var p = spitPool[nextSpitIndex];
    nextSpitIndex = (nextSpitIndex + 1) % SPIT_POOL_SIZE;
    p.active = true;
    p.mesh.visible = true;
    p.mesh.material.opacity = 1;
    p.mesh.position.copy(fromPos);
    p.vel.copy(targetPos).sub(fromPos).normalize().multiplyScalar(SPIT_SPEED);
    p.life = 2.5;
  }

  function updateSpits(dt) {
    for (var i = 0; i < spitPool.length; i++) {
      var p = spitPool[i];
      if (!p.active) continue;
      p.life -= dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      var distToPlayer = p.mesh.position.distanceTo(player.pos);
      if (distToPlayer < 0.8) {
        damagePlayer(SPIT_DAMAGE);
        spawnImpactBurst(p.mesh.position.clone(), 0x9fe23a, 10);
        p.active = false;
        p.mesh.visible = false;
        continue;
      }
      if (p.life <= 0 || p.mesh.position.y < -1) {
        p.active = false;
        p.mesh.visible = false;
      }
    }
  }

  function updateVfx(dt) {
    for (var ti = tracers.length - 1; ti >= 0; ti--) {
      var tr = tracers[ti];
      tr.life -= dt;
      tr.line.material.opacity = Math.max(0, tr.life / tr.maxLife) * 0.9;
      if (tr.life <= 0) {
        vfxGroup.remove(tr.line);
        tr.line.geometry.dispose();
        tr.line.material.dispose();
        tracers.splice(ti, 1);
      }
    }

    for (var qi = 0; qi < particlePool.length; qi++) {
      var part = particlePool[qi];
      if (!part.active) continue;
      part.life -= dt;
      if (part.life <= 0) {
        part.active = false;
        part.mesh.visible = false;
        continue;
      }
      part.vel.y -= 9 * dt;
      part.mesh.position.addScaledVector(part.vel, dt);
      part.mesh.material.opacity = Math.max(0, part.life / part.maxLife);
    }

    updateGibs(dt);
    updateHeadGibs(dt);
    updateSmoke(dt);
    updateCasings(dt);

    zombies.forEach(function (z) {
      if (z.dead) return;
      if (z.punch > 0) {
        z.punch -= dt;
        var k = Math.max(0, z.punch / ZOMBIE_PUNCH_DURATION);
        z.group.userData.parts.forEach(function (part) { part.material.emissive.setRGB(k, 0, 0); });
      }
    });
  }

  var shakeTime = 0;
  var SHAKE_DURATION = 0.14;
  var SHAKE_MAGNITUDE = 0.03;
  function triggerShake() {
    shakeTime = SHAKE_DURATION;
  }

  // ---------- Shooting ----------
  var score = 0;
  var raycaster = new THREE.Raycaster();
  var crosshairEl = document.getElementById("crosshair");
  var muzzleFlashEl = document.getElementById("muzzleFlash");
  var scoreLabel = document.getElementById("scoreLabel");
  var waveLabel = document.getElementById("waveLabel");
  var healthBarInner = document.getElementById("healthBarInner");
  var damageVignetteEl = document.getElementById("damageVignette");
  var critVignetteEl = document.getElementById("critVignette");
  var hudEl = document.getElementById("hud");

  function showScorePop(amount) {
    var el = document.createElement("div");
    el.className = "scorePop";
    el.textContent = "+" + amount;
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 650);
  }

  var fireCooldownTimer = 0;

  function shoot() {
    if (gameOver || fireCooldownTimer > 0) return;
    fireCooldownTimer = FIRE_COOLDOWN;

    muzzleFlashEl.classList.remove("flash");
    void muzzleFlashEl.offsetWidth; // restart animation
    muzzleFlashEl.classList.add("flash");
    triggerShake();
    triggerRecoil();
    sfxShoot();

    var muzzleWorldPos = new THREE.Vector3();
    gunGroup.getWorldPosition(muzzleWorldPos);
    spawnMuzzleSmoke(muzzleWorldPos);
    spawnCasing();

    var muzzleOrigin = camera.position.clone();
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    raycaster.far = SHOOT_RANGE;

    var zombieHits = raycaster.intersectObjects(zombieHitMeshes);
    var obstacleHits = raycaster.intersectObjects(obstacles);
    var zombieDist = zombieHits.length > 0 ? zombieHits[0].distance : Infinity;
    var obstacleDist = obstacleHits.length > 0 ? obstacleHits[0].distance : Infinity;

    if (zombieHits.length > 0 && zombieDist < obstacleDist) {
      var hit = zombieHits[0];
      var hitGroup = hit.object.userData.rootZombie;
      var z = null;
      for (var i = 0; i < zombies.length; i++) {
        if (zombies[i].group === hitGroup) { z = zombies[i]; break; }
      }
      var isHeadshot = z && !z.dead && hit.object === z.headMesh;

      crosshairEl.classList.remove("hit");
      void crosshairEl.offsetWidth;
      crosshairEl.classList.add("hit");
      spawnTracer(muzzleOrigin, hit.point);
      spawnImpactBurst(hit.point, isHeadshot ? 0xcc1c1c : 0x9c1f1f, isHeadshot ? 20 : 12);
      sfxHit();
      sfxSquelch();

      if (z && !z.dead) {
        z.hp -= isHeadshot ? ZOMBIE_DAMAGE_PER_HIT * HEADSHOT_MULT : ZOMBIE_DAMAGE_PER_HIT;
        z.punch = ZOMBIE_PUNCH_DURATION;
        if (z.hp <= 0) {
          if (isHeadshot) {
            showBigPop("HEADSHOT", "#ff3b3b");
            sfxHeadshot();
          }
          showScorePop(z.cfg.score + (isHeadshot ? 15 : 0));
          killZombie(z, isHeadshot);
        } else {
          showScorePop(5);
          score += 5;
          scoreLabel.textContent = "Score: " + score;
        }
      }
    } else if (obstacleHits.length > 0) {
      var oHit = obstacleHits[0];
      spawnTracer(muzzleOrigin, oHit.point);
      spawnImpactBurst(oHit.point, 0xcccccc, 8);
    } else {
      var farPoint = raycaster.ray.at(SHOOT_RANGE, new THREE.Vector3());
      spawnTracer(muzzleOrigin, farPoint);
    }
  }

  var shootBtn = document.getElementById("shootBtn");
  shootBtn.addEventListener("touchstart", function (e) { e.preventDefault(); shoot(); }, { passive: false });
  shootBtn.addEventListener("mousedown", function (e) { e.preventDefault(); shoot(); });

  var jumpBtn = document.getElementById("jumpBtn");
  jumpBtn.addEventListener("touchstart", function (e) { e.preventDefault(); wantJump = true; sfxJump(); }, { passive: false });
  jumpBtn.addEventListener("mousedown", function (e) { e.preventDefault(); wantJump = true; sfxJump(); });

  // ---------- Player damage ----------
  function damagePlayer(amount) {
    if (gameOver) return;
    player.health = Math.max(0, player.health - amount);
    healthBarInner.style.width = (player.health / PLAYER_MAX_HEALTH * 100) + "%";
    healthBarInner.style.background = player.health > 40
      ? "linear-gradient(90deg, #6fd94a, #9bff5e)"
      : "linear-gradient(90deg, #d9502f, #ff8a4a)";
    damageVignetteEl.classList.remove("hit");
    void damageVignetteEl.offsetWidth;
    damageVignetteEl.classList.add("hit");
    critVignetteEl.classList.toggle("active", player.health > 0 && player.health <= 30);
    sfxPlayerHurt();
    if (player.health <= 0) endGame();
  }

  // ---------- Game state ----------
  var gameOver = false;
  var endScreen = document.getElementById("endScreen");

  function endGame() {
    gameOver = true;
    document.getElementById("finalScore").textContent = "Final score: " + score;
    document.getElementById("finalWave").textContent = "Reached wave: " + wave;
    document.getElementById("finalKills").textContent = "Zombies killed: " + zombiesKilled;
    endScreen.style.display = "flex";
    sfxGameOver();
  }

  document.getElementById("restartBtn").addEventListener("click", function () {
    zombies.slice().forEach(function (z) { detachZombieHitbox(z); removeZombie(z); });
    bloodPoolPool.forEach(function (mesh) { mesh.visible = false; mesh.material.opacity = 0; });
    gibPool.forEach(function (g) { g.active = false; g.mesh.visible = false; });
    score = 0;
    zombiesKilled = 0;
    wave = 0;
    waveTransitioning = false;
    zombiesAliveInWave = 0;
    comboCount = 0;
    comboTimer = 0;
    player.health = PLAYER_MAX_HEALTH;
    player.pos.set(0, PLAYER_HEIGHT, 0);
    player.vy = 0;
    gameOver = false;
    scoreLabel.textContent = "Score: 0";
    healthBarInner.style.width = "100%";
    healthBarInner.style.background = "linear-gradient(90deg, #6fd94a, #9bff5e)";
    critVignetteEl.classList.remove("active");
    endScreen.style.display = "none";
    startWave(1);
  });

  // ---------- Main loop ----------
  var clock = new THREE.Clock();

  function updateZombies(dt) {
    zombies.forEach(function (z) {
      var g = z.group;

      if (z.dead) {
        z.fallElapsed += dt;
        var k = Math.min(1, z.fallElapsed / ZOMBIE_FALL_DURATION);
        g.rotation.x = k * (Math.PI / 2.1);
        g.position.y = -k * 0.4;
        return;
      }

      z.groanTimer -= dt;
      if (z.groanTimer <= 0) {
        z.groanTimer = 3 + Math.random() * 5;
        var distToPlayer = g.position.distanceTo(player.pos);
        if (distToPlayer < 18) sfxGroan();
      }

      if (z.hp < z.maxHp * 0.6) {
        z.bleedTimer -= dt;
        if (z.bleedTimer <= 0) {
          z.bleedTimer = BLEED_INTERVAL;
          spawnBloodPool(g.position.clone().setY(0.02), 0.4 * z.cfg.scale);
        }
      }

      var toPlayer = new THREE.Vector3(player.pos.x - g.position.x, 0, player.pos.z - g.position.z);
      var dist = toPlayer.length();

      if (z.cfg.ranged && dist <= SPITTER_RANGE && dist > ZOMBIE_ATTACK_RANGE) {
        // spitters hold their distance and lob acid instead of closing in
        g.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) {
          z.attackCooldown = SPITTER_COOLDOWN;
          spawnSpit(g.position.clone().setY(0.9 * z.cfg.scale), player.pos);
          sfxSpit();
          z.punch = ZOMBIE_PUNCH_DURATION * 0.5;
        }
      } else if (dist > ZOMBIE_ATTACK_RANGE) {
        toPlayer.normalize();
        g.position.x += toPlayer.x * z.speed * dt;
        g.position.z += toPlayer.z * z.speed * dt;
        g.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
        z.bobPhase += dt * 8 * (z.speed / ZOMBIE_BASE_SPEED);
        g.position.y = Math.abs(Math.sin(z.bobPhase)) * 0.06;
        g.rotation.z = Math.sin(z.bobPhase * 0.5) * 0.08;
      } else {
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) {
          z.attackCooldown = ZOMBIE_ATTACK_COOLDOWN;
          damagePlayer(z.attackDamage);
          z.punch = ZOMBIE_PUNCH_DURATION * 0.6;
        }
      }
    });
  }

  function update(dt) {
    dt = Math.min(dt, 0.05);

    updateVfx(dt);
    updateSpits(dt);
    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
    if (fireCooldownTimer > 0) {
      fireCooldownTimer = Math.max(0, fireCooldownTimer - dt);
      shootBtn.style.opacity = fireCooldownTimer > 0 ? "0.45" : "1";
    }
    recoilKick = Math.max(0, recoilKick - dt * 7);
    gunGroup.position.z = gunBasePos.z + recoilKick * 0.12;
    gunGroup.rotation.x = gunBaseRotX - recoilKick * 0.22;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) comboCount = 0;
    }

    if (gameOver) return;

    updateZombies(dt);

    var forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).multiplyScalar(-moveVec.y);
    var right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).multiplyScalar(moveVec.x);
    var moveDir = forward.add(right);
    if (moveDir.lengthSq() > 1) moveDir.normalize();

    player.pos.x += moveDir.x * MOVE_SPEED * dt;
    player.pos.z += moveDir.z * MOVE_SPEED * dt;
    clampToArena(player.pos);

    // gravity + jump
    if (wantJump && player.grounded) {
      player.vy = JUMP_SPEED;
      player.grounded = false;
    }
    wantJump = false;
    player.vy += GRAVITY * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= PLAYER_HEIGHT) {
      player.pos.y = PLAYER_HEIGHT;
      player.vy = 0;
      player.grounded = true;
    }

    // head bob while walking on the ground
    var moveSpeed = moveDir.length();
    if (player.grounded && moveSpeed > 0.05) {
      bobPhase += dt * BOB_FREQUENCY;
    } else {
      bobPhase = 0;
    }
    var bobOffset = player.grounded ? Math.sin(bobPhase) * BOB_AMOUNT * moveSpeed : 0;

    camera.position.set(player.pos.x, player.pos.y + bobOffset, player.pos.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if (shakeTime > 0) {
      var shakeAmt = (shakeTime / SHAKE_DURATION) * SHAKE_MAGNITUDE;
      camera.rotation.y += (Math.random() - 0.5) * shakeAmt;
      camera.rotation.x += (Math.random() - 0.5) * shakeAmt;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    update(dt);
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById("loading").style.display = "none";
  startWave(1);
  animate();
})();
</script>
</body>
