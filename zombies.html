<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zombie Siege Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #14161c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* faint always-on CRT/hologram scanlines + a cool cyan/magenta corner
     vignette for a cyberpunk HUD feel, sitting under the interactive controls */
  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: overlay;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(20,0,40,0.35) 100%),
      linear-gradient(120deg, rgba(47,246,255,0.05), rgba(255,42,223,0.05));
  }

  #damageVignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 0 rgba(180,0,0,0);
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(180,0,0,0) 55%, rgba(180,0,0,0.55) 100%);
  }
  #damageVignette.hit {
    animation: damageFlash 350ms ease-out;
  }
  @keyframes damageFlash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  #critVignette {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(140,0,0,0) 45%, rgba(140,0,0,0.5) 100%);
  }
  #critVignette.active {
    animation: critPulse 1100ms ease-in-out infinite;
  }
  @keyframes critPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.65; }
  }

  /* cyberpunk bracket reticle: four corner brackets + a glowing center dot */
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 30px;
    height: 30px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 4px rgba(47,246,255,0.85)) drop-shadow(0 0 2px rgba(255,42,223,0.5));
  }
  #crosshair::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: #2ff6ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .chCorner {
    position: absolute;
    width: 9px;
    height: 9px;
    border: 0 solid #2ff6ff;
    transition: border-color 80ms linear;
  }
  .chTL { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .chTR { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .chBL { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
  .chBR { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
  #crosshair.hit {
    animation: crosshairPop 180ms ease-out;
  }
  #crosshair.hit::before { background: #ff2adf; }
  #crosshair.hit .chCorner { border-color: #ff2adf; }
  @keyframes crosshairPop {
    0% { transform: translate(-50%, -50%) scale(1.7); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #muzzleFlash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 260px;
    height: 260px;
    margin-left: -130px;
    margin-top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,220,0.85) 0%, rgba(255,200,90,0.4) 32%, rgba(255,180,60,0) 68%);
    opacity: 0;
  }
  #muzzleFlash.flash {
    animation: muzzleFlashAnim 100ms ease-out;
  }
  @keyframes muzzleFlashAnim {
    0% { opacity: 1; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  .scorePop {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #2ff6ff;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 1px 0 rgba(255,42,223,0.8), -1px 0 rgba(47,246,255,0.6), 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: scorePopAnim 600ms ease-out forwards;
  }
  @keyframes scorePopAnim {
    0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    100% { opacity: 0; transform: translate(-50%, -90px) translateY(0); }
  }

  .wavePop {
    position: absolute;
    left: 50%;
    top: 34%;
    transform: translate(-50%, -50%);
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #ff5e5e;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: wavePopAnim 1600ms ease-out forwards;
  }
  @keyframes wavePopAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  .bigPop {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: bigPopAnim 900ms ease-out forwards;
  }
  @keyframes bigPopAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    35% { transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
  }

  #joystick {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto;
    touch-action: none;
  }
  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(255,255,255,0.8);
  }

  #lookPad {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 55%;
    height: 65%;
    pointer-events: auto;
    touch-action: none;
  }

  /* tactile press feedback for every tappable HUD button */
  #shootBtn:active, #jumpBtn:active, #switchWeaponBtn:active,
  .abilityBtn:active, #restartBtn:active {
    transform: scale(0.9);
    filter: brightness(1.3);
  }

  #shootBtn {
    position: absolute;
    right: 30px;
    bottom: 150px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(60, 160, 40, 0.55);
    border: 3px solid rgba(255,255,255,0.75);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 80ms linear;
  }

  #jumpBtn {
    position: absolute;
    left: 150px;
    bottom: 40px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }

  #switchWeaponBtn {
    position: absolute;
    right: 30px;
    bottom: 246px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(80, 80, 90, 0.55);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }

  /* Ability buttons: compact shared layout with the cooldown countdown
     badged onto the button itself (not a separate stacked label) so the
     whole column stays short enough to fit on small phone screens. */
  .abilityBtn {
    position: absolute;
    left: 150px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 120ms linear, transform 60ms ease, filter 60ms ease;
    font-size: 21px;
    font-weight: 700;
  }
  .abilityBtn.onCooldown {
    opacity: 0.35;
  }
  .cooldownBadge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2px;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    pointer-events: none;
  }

  #lightningBtn {
    bottom: 104px;
    background: rgba(120, 40, 220, 0.5);
    border: 2px solid rgba(200,140,255,0.9);
    box-shadow: 0 0 12px rgba(155,75,255,0.6);
    color: #f0e0ff;
  }
  #lightningCooldownLabel {
    color: #cfe0ff;
  }

  #fireballBtn {
    bottom: 160px;
    background: rgba(210, 60, 10, 0.5);
    border: 2px solid rgba(255,170,90,0.9);
    box-shadow: 0 0 12px rgba(255,110,30,0.6);
    color: #fff0e0;
  }
  #fireballCooldownLabel {
    color: #ffd9b8;
  }

  #fireballFlash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,150,60,0.7) 35%, rgba(255,80,20,0.45) 100%);
    opacity: 0;
  }
  #fireballFlash.flash {
    animation: lightningFlashAnim 260ms ease-out;
  }

  #supernovaBtn {
    bottom: 216px;
    background: rgba(255, 220, 140, 0.35);
    border: 2px solid rgba(255,245,210,0.95);
    box-shadow: 0 0 18px rgba(255,225,150,0.85);
    color: #fffceb;
  }
  #supernovaCooldownLabel {
    color: #fff2d0;
  }

  #supernovaChargeVignette {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: radial-gradient(circle, rgba(255,246,216,0) 40%, rgba(255,246,216,0.35) 100%);
  }
  #supernovaChargeVignette.charging {
    animation: supernovaChargeAnim 0.4s ease-in forwards;
  }
  @keyframes supernovaChargeAnim {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  #supernovaFlash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,240,200,0.95) 30%, rgba(200,160,255,0.6) 70%, rgba(160,90,255,0.3) 100%);
    opacity: 0;
  }
  #supernovaFlash.flash {
    animation: supernovaFlashAnim 800ms ease-out;
  }
  @keyframes supernovaFlashAnim {
    0% { opacity: 1; }
    35% { opacity: 0.92; }
    100% { opacity: 0; }
  }

  #lightningFlash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(196,120,255,0.75) 35%, rgba(155,75,255,0.5) 100%);
    opacity: 0;
  }
  #lightningFlash.flash {
    animation: lightningFlashAnim 220ms ease-out;
  }
  @keyframes lightningFlashAnim {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  #weaponLabel {
    position: absolute;
    right: 18px;
    bottom: 312px;
    width: 84px;
    font-size: 12px;
    text-align: center;
    text-transform: uppercase;
  }

  /* shared cyberpunk "glitch text" look: cyan body with a thin magenta/cyan
     chromatic-aberration fringe, used across the HUD's readouts */
  .neonText {
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #d8fbff;
    text-shadow: 1px 0 rgba(255,42,223,0.8), -1px 0 rgba(47,246,255,0.8), 0 1px 4px rgba(0,0,0,0.9);
    letter-spacing: 0.5px;
  }

  #topBar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 190px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
  }
  #topBarRow {
    display: flex;
    justify-content: space-between;
  }
  #healthBarOuter {
    width: 100%;
    max-width: 220px;
    height: 14px;
    border-radius: 3px;
    background: rgba(6,10,20,0.65);
    border: 1px solid rgba(47,246,255,0.7);
    box-shadow: 0 0 8px rgba(47,246,255,0.45), inset 0 0 4px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  #healthBarInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #1fd6c0, #39ff7a);
    box-shadow: 0 0 10px rgba(57,255,122,0.8);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 10px),
      linear-gradient(90deg, #1fd6c0, #39ff7a);
    transition: width 150ms linear, background-image 150ms linear, box-shadow 150ms linear;
  }

  #hint {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    text-align: center;
    max-width: 80%;
    opacity: 0.85;
  }

  #gameNav {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    max-width: 170px;
    pointer-events: auto;
  }
  .navLink, .navCurrent {
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #d8fbff;
    text-decoration: none;
    font-size: 11px;
    text-transform: uppercase;
    background: rgba(6,10,20,0.55);
    border: 1px solid rgba(47,246,255,0.6);
    border-radius: 4px;
    padding: 4px 7px;
    text-shadow: 0 0 4px rgba(47,246,255,0.7);
  }
  .navCurrent {
    background: rgba(255,42,223,0.22);
    border-color: rgba(255,42,223,0.85);
    color: #ffe0fb;
    text-shadow: 0 0 5px rgba(255,42,223,0.85);
    font-weight: 700;
  }

  #endScreen {
    position: fixed;
    inset: 0;
    background: rgba(6,2,16,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #d8fbff;
    z-index: 50;
    pointer-events: auto;
    text-align: center;
    padding: 20px;
  }
  #endScreen h1 {
    font-size: 30px;
    margin: 0 0 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff2adf;
    text-shadow: 0 0 12px rgba(255,42,223,0.85), 0 0 24px rgba(255,42,223,0.5);
  }
  #endScreen p { font-size: 15px; margin: 4px 0; opacity: 0.9; }
  #restartBtn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 15px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 4px;
    border: 1px solid rgba(47,246,255,0.9);
    background: rgba(47,246,255,0.15);
    box-shadow: 0 0 14px rgba(47,246,255,0.55);
    color: #d8fbff;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #0e0a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace;
    color: #2ff6ff;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 18px;
    z-index: 100;
    text-shadow: 0 0 8px rgba(47,246,255,0.7);
  }
</style>
</head>
<body>

<div id="loading">Loading graveyard...</div>

<div id="hud">
  <div id="scanlines"></div>
  <div id="damageVignette"></div>
  <div id="critVignette"></div>
  <div id="lightningFlash"></div>
  <div id="fireballFlash"></div>
  <div id="supernovaChargeVignette"></div>
  <div id="supernovaFlash"></div>
  <div id="crosshair">
    <span class="chCorner chTL"></span>
    <span class="chCorner chTR"></span>
    <span class="chCorner chBL"></span>
    <span class="chCorner chBR"></span>
  </div>
  <div id="muzzleFlash"></div>
  <div id="topBar">
    <div id="topBarRow">
      <div id="scoreLabel" class="neonText">Score: 0</div>
      <div id="waveLabel" class="neonText">Wave: 1</div>
    </div>
    <div id="healthBarOuter"><div id="healthBarInner"></div></div>
  </div>
  <div id="hint" class="neonText">Left pad: move &middot; Right side: look &middot; &uarr;: jump &middot; Green button: shoot &middot; &#8635;: switch weapon &middot; &#9889;: lightning &middot; &#128293;: fireball &middot; &#9728;&#65039;: supernova</div>
  <div id="gameNav">
    <a class="navLink" href="index.html">Builder</a>
    <a class="navLink" href="fps.html">Range</a>
    <a class="navLink" href="powers.html">Powers</a>
    <span class="navCurrent">Zombies</span>
  </div>

  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookPad"></div>
  <div id="jumpBtn">&#8593;</div>
  <div id="supernovaBtn" class="abilityBtn">&#9728;&#65039;<span id="supernovaCooldownLabel" class="cooldownBadge"></span></div>
  <div id="fireballBtn" class="abilityBtn">&#128293;<span id="fireballCooldownLabel" class="cooldownBadge"></span></div>
  <div id="lightningBtn" class="abilityBtn">&#9889;<span id="lightningCooldownLabel" class="cooldownBadge"></span></div>
  <div id="weaponLabel" class="neonText">Pistol</div>
  <div id="switchWeaponBtn">&#8635;</div>
  <div id="shootBtn">SHOOT</div>
</div>

<div id="endScreen">
  <h1>You died</h1>
  <p id="finalScore">Final score: 0</p>
  <p id="finalWave">Reached wave: 1</p>
  <p id="finalKills">Zombies killed: 0</p>
  <button id="restartBtn">Play again</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  var GRAVITY = -18;
  var JUMP_SPEED = 6.5;
  var MOVE_SPEED = 5;
  var PLAYER_HEIGHT = 1.7;
  var ARENA_HALF = 34;
  var ZOMBIE_PUNCH_DURATION = 0.18;
  var BOB_FREQUENCY = 9;
  var BOB_AMOUNT = 0.045;
  var PLAYER_MAX_HEALTH = 100;
  var ZOMBIE_HP = 30;
  var ZOMBIE_DAMAGE_PER_HIT = 15;
  var ZOMBIE_ATTACK_RANGE = 1.3;
  var ZOMBIE_ATTACK_DAMAGE = 8;
  var ZOMBIE_ATTACK_COOLDOWN = 0.9;
  var ZOMBIE_BASE_SPEED = 1.5;
  var ZOMBIE_BASE_COUNT = 4;
  var WAVE_ANNOUNCE_DELAY = 1400;
  var HEADSHOT_MULT = 3;
  var ZOMBIE_FALL_DURATION = 0.55;
  var GORE_LINGER = 6;
  var BLOOD_POOL_POOL_SIZE = 60;
  var GIB_POOL_SIZE = 64;
  var COMBO_WINDOW = 1.3;
  var BLEED_INTERVAL = 0.9;
  var DISMEMBER_CHANCE = 0.5;
  var WALL_SPLATTER_RANGE = 4;

  // ---------- Weapons ----------
  // sfxShoot/sfxShotgun/sfxSMG/sfxSniper are function declarations defined below —
  // hoisted, so referencing them here at array-init time is safe.
  // Each weapon gets its own saturated neon tracer/light color instead of one
  // shared muted tone, so muzzle flashes, beams, and sparks all read as glowing.
  var NEON_GREEN = 0x39ff14;
  var NEON_ORANGE = 0xff5f1f;
  var NEON_YELLOW = 0xfff01f;
  var NEON_PINK = 0xff2fd1;
  var NEON_CYAN = 0x39f9ff;
  var NEON_PURPLE = 0x9b4bff;
  var NEON_FIRE = 0xff5a1f;
  var WEAPONS = [
    { name: "Pistol", visual: "pistol", cooldown: 0.28, damage: 15, pellets: 1, spread: 0, range: 60, recoil: 1, shakeMult: 1, tracerColor: NEON_GREEN, evaporate: false, sfx: function () { return sfxShoot(); } },
    { name: "Shotgun", visual: "shotgun", cooldown: 0.8, damage: 9, pellets: 6, spread: 0.09, range: 22, recoil: 1.9, shakeMult: 1.8, tracerColor: NEON_ORANGE, evaporate: false, sfx: function () { return sfxShotgun(); } },
    { name: "SMG", visual: "smg", cooldown: 0.09, damage: 7, pellets: 1, spread: 0.028, range: 55, recoil: 0.5, shakeMult: 0.55, tracerColor: NEON_YELLOW, evaporate: false, sfx: function () { return sfxSMG(); } },
    { name: "Sniper", visual: "sniper", cooldown: 1.05, damage: 55, pellets: 1, spread: 0, range: 90, recoil: 2.4, shakeMult: 2.2, tracerColor: NEON_PINK, evaporate: false, sfx: function () { return sfxSniper(); } },
    { name: "Laser", visual: "laser", cooldown: 0.45, damage: 42, pellets: 1, spread: 0, range: 75, recoil: 0.75, shakeMult: 0.8, tracerColor: NEON_CYAN, evaporate: true, sfx: function () { return sfxLaser(); } }
  ];
  var BULLET_TRACER_COLOR = NEON_GREEN;

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, freqEnd, duration, type, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playNoiseBurst(duration, filterFreq, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.value = volume;
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

    ctx.fillStyle = "#5a4f37";
    ctx.fillRect(0, 0, size, size);

    // bare dirt patches
    for (var d = 0; d < 14; d++) {
      var dx = Math.random() * size, dy = Math.random() * size, dr = 10 + Math.random() * 26;
      var dgrad = ctx.createRadialGradient(dx, dy, 0, dx, dy, dr);
      dgrad.addColorStop(0, "rgba(70,55,35,0.55)");
      dgrad.addColorStop(1, "rgba(70,55,35,0)");
      ctx.fillStyle = dgrad;
      ctx.beginPath();
      ctx.arc(dx, dy, dr, 0, Math.PI * 2);
      ctx.fill();
    }

    // subtle grid seams (cracked ground), faintly cyan-lit like a buried
    // circuit line rather than plain dirt cracks
    ctx.strokeStyle = "rgba(60,220,255,0.1)";
    ctx.lineWidth = 2;
    var cell = size / 8;
    for (var i = 0; i <= 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, size);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cell);
      ctx.lineTo(size, i * cell);
      ctx.stroke();
    }

    // sparse withered grass blades (dull yellow-brown, not green)

  function randomEdgeSpawn() {
    var margin = 1.5;
    var side = Math.floor(Math.random() * 4);
    var x, z;
    if (side === 0) { x = -ARENA_HALF + margin; z = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else if (side === 1) { x = ARENA_HALF - margin; z = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else if (side === 2) { z = -ARENA_HALF + margin; x = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    else { z = ARENA_HALF - margin; x = (Math.random() * 2 - 1) * (ARENA_HALF - margin); }
    return new THREE.Vector3(x, 0, z);
  }

  function createZombie(type) {
    var cfg = ZOMBIE_TYPES[type];
    var wMult = cfg.bodyWidthMult;
    var lMult = cfg.legLenMult;

    var group = new THREE.Group();
    var skinMat = new THREE.MeshStandardMaterial({ map: skinTexByType[type], roughness: 0.9 });
    var shirtMat = new THREE.MeshStandardMaterial({ map: shirtTexByType[type], roughness: 0.85 });
    var pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b2c26, roughness: 0.85 });

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), skinMat);
    head.position.y = 1.5;
    head.rotation.x = type === "runner" ? 0.05 : 0.25; // runners hold their head up, hunting for prey

    var torso = new THREE.Mesh(new THREE.BoxGeometry(0.6 * wMult, 0.72, 0.32 * wMult), shirtMat);
    torso.position.y = 0.98;
    torso.rotation.x = type === "runner" ? -0.05 : 0.12; // hunched, except runners lean forward to sprint

    var hips = new THREE.Mesh(new THREE.BoxGeometry(0.48 * wMult, 0.34, 0.3 * wMult), pantsMat);
    hips.position.y = 0.46;

    var legGeo = new THREE.BoxGeometry(0.2, 0.85 * lMult, 0.24);
    var legL = new THREE.Mesh(legGeo, pantsMat);
    legL.position.set(-0.15, -0.05, 0);
    var legR = new THREE.Mesh(legGeo, pantsMat);
    legR.position.set(0.15, -0.05, 0);

    // arms reach forward, classic zombie pose
    var armGeo = new THREE.BoxGeometry(0.17, 0.62, 0.19);
    var armL = new THREE.Mesh(armGeo, skinMat);
    armL.position.set(-0.4 * wMult, 1.02, -0.18);
    armL.rotation.x = -1.15;
    var armR = new THREE.Mesh(armGeo, skinMat);
    armR.position.set(0.4 * wMult, 1.02, -0.18);
    armR.rotation.x = -1.15;

    var parts = [head, torso, hips, legL, legR, armL, armR];

    if (type === "spitter") {
      // distended, bloated belly sac used to lob projectiles
      var belly = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), skinMat);
      belly.scale.set(1, 0.85, 0.9);
      belly.position.set(0, 0.78, 0.12);
      parts.push(belly);
    }

    parts.forEach(function (part) {
      part.castShadow = true;
      part.receiveShadow = true;
      group.add(part);
      part.userData.rootZombie = group;
      zombieHitMeshes.push(part);
    });

    group.scale.setScalar(cfg.scale);

    group.userData.parts = parts;
    group.userData.head = head;
    return group;

  function pickZombieType(n) {
    var options = [{ type: "walker", w: 45 }];
    if (n >= ZOMBIE_TYPES.runner.minWave) options.push({ type: "runner", w: Math.min(30, 12 + n * 3) });
    if (n >= ZOMBIE_TYPES.spitter.minWave) options.push({ type: "spitter", w: Math.min(28, 10 + (n - 1) * 3) });
    if (n >= ZOMBIE_TYPES.brute.minWave) options.push({ type: "brute", w: Math.min(30, 8 + (n - 2) * 4) });
    var total = options.reduce(function (s, o) { return s + o.w; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < options.length; i++) {
      r -= options[i].w;
      if (r <= 0) return options[i].type;
    }
    return "walker";
  }

  function spawnZombie(speedMult, forceType) {
    var type = forceType || pickZombieType(wave);
    var cfg = ZOMBIE_TYPES[type];
    var group = createZombie(type);
    group.position.copy(randomEdgeSpawn());
    group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(group);
    var z = {
      group: group,
      type: type,
      cfg: cfg,
      hp: Math.round(ZOMBIE_HP * cfg.hpMult),
      maxHp: Math.round(ZOMBIE_HP * cfg.hpMult),
      speed: ZOMBIE_BASE_SPEED * speedMult * cfg.speedMult * (0.85 + Math.random() * 0.3),
      attackCooldown: 0,
      attackDamage: Math.round(ZOMBIE_ATTACK_DAMAGE * cfg.dmgMult),
      dead: false,
      punch: 0,
      groanTimer: 2 + Math.random() * 4,
      bleedTimer: 0,
      bobPhase: Math.random() * Math.PI * 2,
      isBrute: type === "brute",

      fallElapsed: 0

    zombies.push(z);
    zombiesAliveInWave++;
    return z;

  function startWave(n) {
    wave = n;
    waveLabel.textContent = "Wave: " + wave;
    var count = Math.min(ZOMBIE_BASE_COUNT + (wave - 1) * 2, 18);
    var speedMult = 1 + (wave - 1) * 0.06;

  function removeZombie(z) {

  function detachZombieHitbox(z) {
    var hidx;
    z.group.userData.parts.forEach(function (part) {

  var EVAPORATE_DURATION = 0.32;

  var DEFAULT_EVAP_TINT = 0x6fd8ff;

  function killZombie(z, headshot, evaporate, evapTint) {
    if (z.dead) return;
    z.dead = true;
    z.fallElapsed = 0;
    z.evaporating = !!evaporate;
    z.evapTint = evapTint || DEFAULT_EVAP_TINT;
    detachZombieHitbox(z);
    zombiesKilled++;
    zombiesAliveInWave--;

    var points = z.cfg.score + (headshot ? 15 : 0);
    score += points;
    scoreLabel.textContent = "Score: " + score;

    if (evaporate) {
      sfxEvaporate();
      spawnEvaporateEffect(z.group.position.clone().setY(0.9 * z.cfg.scale), z.cfg.scale, z.evapTint);
      setTimeout(function () { removeZombie(z); }, EVAPORATE_DURATION * 1000 + 100);

  // ---------- Input: joystick ----------
  var joystickEl = document.getElementById("joystick");

  var moveVec = { x: 0, y: 0 };
  var joystickTouchId = null;
  var joystickCenter = { x: 0, y: 0 };
  var JOYSTICK_MAX = 40;

  function joystickStart(id, clientX, clientY) {
    joystickTouchId = id;
    var rect = joystickEl.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    joystickMove(clientX, clientY);
  }
  function joystickMove(clientX, clientY) {
    var dx = clientX - joystickCenter.x;
    var dy = clientY - joystickCenter.y;
    var dist = Math.min(JOYSTICK_MAX, Math.sqrt(dx * dx + dy * dy));
    var angle = Math.atan2(dy, dx);
    var kx = Math.cos(angle) * dist;
    var ky = Math.sin(angle) * dist;
    joystickKnob.style.transform = "translate(" + kx + "px," + ky + "px)";
    moveVec.x = kx / JOYSTICK_MAX;
    moveVec.y = ky / JOYSTICK_MAX;
  }
  function joystickEnd() {
    joystickTouchId = null;
    moveVec.x = 0; moveVec.y = 0;
    joystickKnob.style.transform = "translate(0,0)";
  }

  joystickEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joystickStart(t.identifier, t.clientX, t.clientY);

  joystickEl.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) joystickMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  joystickEl.addEventListener("touchend", function (e) { e.preventDefault(); joystickEnd(); }, { passive: false });
  joystickEl.addEventListener("touchcancel", joystickEnd);

  function lookMove(x, y) {
    var dx = x - lastLook.x;
    var dy = y - lastLook.y;
    lastLook.x = x; lastLook.y = y;
    player.yaw -= dx * LOOK_SENSITIVITY;
    player.pitch -= dy * LOOK_SENSITIVITY;

  // ---------- VFX: tracers, impact particles, screen shake ----------
  var vfxGroup = new THREE.Group();

  // Tracers are thin glowing beam meshes (not 1px Lines, which browsers
  // render at a fixed hairline width) so they read as bright, visible shots.
  var tracers = []; // { mesh, material, life, maxLife }
  var tracerBeamGeo = new THREE.BoxGeometry(1, 1, 1);
  var UNIT_Z = new THREE.Vector3(0, 0, 1);

  function makeTracerBeam(from, dir, length, color, thickness, opacity) {
    var mat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    });
    var mesh = new THREE.Mesh(tracerBeamGeo, mat);
    mesh.scale.set(thickness, thickness, length);
    mesh.position.copy(from).addScaledVector(dir, length / 2);
    mesh.quaternion.setFromUnitVectors(UNIT_Z, dir);
    vfxGroup.add(mesh);
    return { mesh: mesh, material: mat };
  }

  // Neon "tube" look: a slim white-hot core plus a wider, dimmer colored
  // glow layer riding along the same beam.
  function spawnTracer(from, to, color) {
    var offset = to.clone().sub(from);
    var length = offset.length();
    if (length < 0.001) return;
    var dir = offset.normalize();
    var neonColor = color || BULLET_TRACER_COLOR;

    var glow = makeTracerBeam(from, dir, length, neonColor, 0.05, 0.55);
    var core = makeTracerBeam(from, dir, length, 0xffffff, 0.014, 1);
    tracers.push({ mesh: glow.mesh, material: glow.material, life: 0.09, maxLife: 0.09 });
    tracers.push({ mesh: core.mesh, material: core.material, life: 0.09, maxLife: 0.09 });
  }

  var PARTICLE_POOL_SIZE = 90;
  var particlePool = [];
  var particleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
  for (var pi = 0; pi < PARTICLE_POOL_SIZE; pi++) {
    var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    var pMesh = new THREE.Mesh(particleGeo, pMat);
    pMesh.visible = false;
    vfxGroup.add(pMesh);
    particlePool.push({ mesh: pMesh, vel: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextParticleIndex = 0;

  function spawnImpactBurst(position, color, count, glow) {
    for (var n = 0; n < count; n++) {
      var p = particlePool[nextParticleIndex];
      nextParticleIndex = (nextParticleIndex + 1) % PARTICLE_POOL_SIZE;
      p.active = true;
      p.mesh.visible = true;
      p.mesh.position.copy(position);
      p.mesh.material.color.setHex(color);
      p.mesh.material.opacity = 1;
      p.mesh.material.blending = glow ? THREE.AdditiveBlending : THREE.NormalBlending;
      p.mesh.material.toneMapped = !glow;
      var stretch = glow ? 1.8 + Math.random() : 1;
      p.mesh.scale.set(1, 1, stretch);
      var speed = (glow ? 3 : 1.5) + Math.random() * (glow ? 4.5 : 2.5);
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI * 0.6;
      p.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed + 1,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      if (glow) {
        p.mesh.quaternion.setFromUnitVectors(UNIT_Z, p.vel.clone().normalize());
      } else {
        p.mesh.quaternion.identity();
      }
      p.life = (glow ? 0.16 : 0.35) + Math.random() * (glow ? 0.12 : 0.25);
      p.maxLife = p.life;
    }
  }

  function mixWithWhite(hex, amount) {
    var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    r = Math.round(r + (255 - r) * amount);
    g = Math.round(g + (255 - g) * amount);
    b = Math.round(b + (255 - b) * amount);
    return (r << 16) | (g << 8) | b;
  }

  function spawnEvaporateEffect(position, scale, tint) {
    var color = tint || DEFAULT_EVAP_TINT;
    spawnImpactBurst(position, mixWithWhite(color, 0.75), Math.round(18 * scale), true);
    spawnImpactBurst(position, color, Math.round(12 * scale), true);

  // Reusable expanding ground shockwave ring, used by both the Fireball and
  // the Supernova (staggered, multiple rings, for a richer layered blast).
  var sharedRingGeo = new THREE.RingGeometry(0.1, 0.32, 28);
  function spawnExpandingRing(position, color, targetScale, life, opacity, delayMs) {
    setTimeout(function () {
      var ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide, depthWrite: false });
      var ring = new THREE.Mesh(sharedRingGeo, ringMat);
      ring.position.copy(position);
      ring.position.y = Math.max(0.05, ring.position.y);
      ring.rotation.x = -Math.PI / 2;
      scene.add(ring);
      var elapsed = 0;
      var interval = setInterval(function () {
        elapsed += 0.03;
        var k = Math.min(1, elapsed / life);
        var s = 1 + k * targetScale;
        ring.scale.set(s, s, s);
        ringMat.opacity = opacity * (1 - k);
        if (k >= 1) {
          clearInterval(interval);
          scene.remove(ring);
          ringMat.dispose();
        }
      }, 30);
    }, delayMs || 0);
  }

  // The ultimate ability's detonation: a bright expanding core, three
  // color-shifting shockwave rings (white -> cyan -> violet), a huge burst
  // of embers in every direction, and a big lingering dynamic light.
  function spawnSupernovaBlast(center) {
    var coreGeo = new THREE.SphereGeometry(1, 20, 20);
    var coreMat = new THREE.MeshBasicMaterial({ color: SUPERNOVA_CORE_COLOR, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, toneMapped: false, depthWrite: false });
    var core = new THREE.Mesh(coreGeo, coreMat);
    core.position.copy(center);
    scene.add(core);
    var coreLife = 0.55, coreElapsed = 0;
    var coreInterval = setInterval(function () {
      coreElapsed += 0.03;
      var k = Math.min(1, coreElapsed / coreLife);
      var s = 1 + k * 11;
      core.scale.set(s, s, s);

        scene.remove(core);
        coreMat.dispose();

    spawnExpandingRing(center, 0xffffff, 48, 0.85, 0.9, 0);
    spawnExpandingRing(center, 0x9be8ff, 44, 0.95, 0.75, 90);
    spawnExpandingRing(center, NEON_PURPLE, 40, 1.05, 0.6, 180);

    spawnImpactBurst(center, SUPERNOVA_CORE_COLOR, 32, true);
    spawnImpactBurst(center, 0x9be8ff, 26, true);

  function explodeFireball(fb, position) {
    var idx = activeFireballs.indexOf(fb);
    if (idx >= 0) activeFireballs.splice(idx, 1);

    fireballFlashEl.classList.add("flash");

    var struck = 0;
    zombies.forEach(function (z) {
      if (z.dead) return;
      var dist = z.group.position.distanceTo(position);
      if (dist > FIREBALL_SPLASH_RADIUS) return;
      struck++;
      z.hp -= FIREBALL_DAMAGE;
      z.punch = ZOMBIE_PUNCH_DURATION;
      if (z.hp <= 0) {
        showScorePop(z.cfg.score);
        killZombie(z, false, true, NEON_FIRE);
      } else {
        showScorePop(5);
        score += 5;
        scoreLabel.textContent = "Score: " + score;
      }
    });

  function updateFireballs(dt) {
    for (var i = activeFireballs.length - 1; i >= 0; i--) {
      var fb = activeFireballs[i];
      var prevPos = fb.mesh.position.clone();
      var moveDist = FIREBALL_SPEED * dt;
      var dir = fb.vel.clone().normalize();

      raycaster.set(prevPos, dir);
      raycaster.far = moveDist + 0.15;
      var obsHits = raycaster.intersectObjects(obstacles);
      if (obsHits.length > 0 && obsHits[0].distance <= moveDist + 0.15) {
        explodeFireball(fb, obsHits[0].point);
        continue;
      }

      var newPos = prevPos.clone().addScaledVector(fb.vel, dt);
      var hitZombiePos = null;
      for (var zi = 0; zi < zombies.length; zi++) {
        var z = zombies[zi];
        if (z.dead) continue;
        var flatDist = Math.hypot(newPos.x - z.group.position.x, newPos.z - z.group.position.z);
        if (flatDist < FIREBALL_HIT_RADIUS && Math.abs(newPos.y - (z.group.position.y + 0.9 * z.cfg.scale)) < 1.2) {
          hitZombiePos = newPos;
          break;
        }
      }
      if (hitZombiePos) {
        explodeFireball(fb, hitZombiePos);
        continue;
      }

      fb.mesh.position.copy(newPos);
      var pulse = 1 + 0.15 * Math.sin(fb.life * 24);
      fb.mesh.scale.setScalar(pulse);

      fb.life -= dt;
      fb.emberTimer -= dt;
      if (fb.emberTimer <= 0) {
        fb.emberTimer = 0.03;
        spawnImpactBurst(fb.mesh.position.clone(), NEON_FIRE, 1, true);
      }

      if (fb.life <= 0 || newPos.y < -2) {
        explodeFireball(fb, newPos);
      }
    }
  }

  // ---------- Lightning ability VFX ----------
  var lightningBolts = []; // { layers: [{mesh, material, baseOpacity}], life, maxLife }
  var LIGHTNING_NEON_COLOR = NEON_PURPLE;

  // Jagged neon bolt built from short glow+core beam segments (same technique
  // as tracers) rather than a thin Line, so it actually looks like a bright
  // lightning bolt instead of a hairline.
  function spawnLightningBolt(from, to) {
    var segments = 7;
    var points = [];
    for (var i = 0; i <= segments; i++) {
      var t = i / segments;
      var p = from.clone().lerp(to, t);
      if (i > 0 && i < segments) {
        p.x += (Math.random() - 0.5) * 0.6;
        p.y += (Math.random() - 0.5) * 0.6;
        p.z += (Math.random() - 0.5) * 0.6;
      }
      points.push(p);
    }
    var layers = [];
    for (var s = 0; s < segments; s++) {
      var segFrom = points[s];
      var segOffset = points[s + 1].clone().sub(segFrom);
      var segLen = segOffset.length();
      if (segLen < 0.001) continue;
      var segDir = segOffset.normalize();
      var glow = makeTracerBeam(segFrom, segDir, segLen, LIGHTNING_NEON_COLOR, 0.09, 0.6);
      var core = makeTracerBeam(segFrom, segDir, segLen, 0xffffff, 0.03, 1);
      layers.push({ mesh: glow.mesh, material: glow.material, baseOpacity: 0.6 });
      layers.push({ mesh: core.mesh, material: core.material, baseOpacity: 1 });
    }
    lightningBolts.push({ layers: layers, life: 0.22, maxLife: 0.22 });
  }

  function updateLightningBolts(dt) {
    for (var li = lightningBolts.length - 1; li >= 0; li--) {
      var b = lightningBolts[li];
      b.life -= dt;
      var k = Math.max(0, b.life / b.maxLife);
      for (var lj = 0; lj < b.layers.length; lj++) {
        b.layers[lj].material.opacity = k * b.layers[lj].baseOpacity;
      }
      if (b.life <= 0) {
        for (var lk = 0; lk < b.layers.length; lk++) {
          vfxGroup.remove(b.layers[lk].mesh);
          b.layers[lk].material.dispose();
        }
        lightningBolts.splice(li, 1);
      }
    }
  }

  function updateVfx(dt) {
    updateLightningBolts(dt);
    for (var ti = tracers.length - 1; ti >= 0; ti--) {
      var tr = tracers[ti];
      tr.life -= dt;
      tr.material.opacity = Math.max(0, tr.life / tr.maxLife);
      if (tr.life <= 0) {
        vfxGroup.remove(tr.mesh);
        tr.material.dispose();
        tracers.splice(ti, 1);
      }
    }

    for (var qi = 0; qi < particlePool.length; qi++) {
      var part = particlePool[qi];
      if (!part.active) continue;
      part.life -= dt;
      if (part.life <= 0) {
        part.active = false;
        part.mesh.visible = false;
        continue;
      }
      part.vel.y -= 9 * dt;
      part.mesh.position.addScaledVector(part.vel, dt);
      part.mesh.material.opacity = Math.max(0, part.life / part.maxLife);
    }

    updateGibs(dt);
    updateHeadGibs(dt);
    updateSmoke(dt);
    updateCasings(dt);

    zombies.forEach(function (z) {
      if (z.dead) return;
      if (z.punch > 0) {
        z.punch -= dt;
        var k = Math.max(0, z.punch / ZOMBIE_PUNCH_DURATION);
        z.group.userData.parts.forEach(function (part) { part.material.emissive.setRGB(k, 0, 0); });
      }
    });
  }

  var shakeTime = 0;
  var shakeMagMult = 1;
  var SHAKE_DURATION = 0.14;
  var SHAKE_MAGNITUDE = 0.03;
  function triggerShake(mult) {
    shakeTime = SHAKE_DURATION;
    shakeMagMult = mult || 1;
  }

  // ---------- Shooting ----------
  var score = 0;
  var raycaster = new THREE.Raycaster();
  var crosshairEl = document.getElementById("crosshair");
  var muzzleFlashEl = document.getElementById("muzzleFlash");
  var scoreLabel = document.getElementById("scoreLabel");
  var waveLabel = document.getElementById("waveLabel");
  var healthBarInner = document.getElementById("healthBarInner");
  var damageVignetteEl = document.getElementById("damageVignette");
  var critVignetteEl = document.getElementById("critVignette");
  var hudEl = document.getElementById("hud");

  function showScorePop(amount) {
    var el = document.createElement("div");
    el.className = "scorePop";
    el.textContent = "+" + amount;
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 650);
  }

  var fireCooldownTimer = 0;
  var currentWeaponIndex = 0;
  var weaponLabelEl = document.getElementById("weaponLabel");

  // Fires a single ray in the given direction, applying weapon damage to whatever it hits.
  // Returns whether it struck a zombie, so shoot() can decide on shared hit feedback.
  function fireRay(direction, damage) {
    var weapon = WEAPONS[currentWeaponIndex];
    // Anchor the tracer's visible start to a point directly on the aim ray
    // (a short distance in front of the camera) rather than the gun model's
    // actual screen-offset position. The gun sits off to the side of the
    // crosshair, so a beam from the literal muzzle to a crosshair-accurate
    // hit point has to visibly bend to get there — at a glance that reads
    // as "shooting to the side" even though the hit itself is always
    // exactly where the crosshair points. Starting on the ray keeps the
    // beam dead straight down the crosshair line every time.
    var muzzleOrigin = camera.position.clone().addScaledVector(direction, 0.4);
    raycaster.set(camera.position, direction);
    raycaster.far = weapon.range;

    var zombieHits = raycaster.intersectObjects(zombieHitMeshes);
    var obstacleHits = raycaster.intersectObjects(obstacles);
    var zombieDist = zombieHits.length > 0 ? zombieHits[0].distance : Infinity;
    var obstacleDist = obstacleHits.length > 0 ? obstacleHits[0].distance : Infinity;

    if (zombieHits.length > 0 && zombieDist < obstacleDist) {
      var hit = zombieHits[0];
      var hitGroup = hit.object.userData.rootZombie;
      var z = null;
      for (var i = 0; i < zombies.length; i++) {
        if (zombies[i].group === hitGroup) { z = zombies[i]; break; }
      }
      var isHeadshot = z && !z.dead && hit.object === z.headMesh;
      var evaporate = weapon.evaporate;

      spawnTracer(muzzleOrigin, hit.point, weapon.tracerColor);
      spawnImpactBurst(hit.point, evaporate ? 0x9fe8ff : (isHeadshot ? 0xff2b2b : 0xe8302f), isHeadshot ? 20 : 12, evaporate);

      // blood spray on any wall/crate close behind the zombie (through-and-through);
      // energy weapons cauterize instead of splattering blood.
      if (!evaporate && obstacleHits.length > 0 && obstacleDist - zombieDist < WALL_SPLATTER_RANGE) {
        var wallHit = obstacleHits[0];
        spawnBloodDecal(wallHit.point, worldNormal(wallHit), 0.7 + Math.random() * 0.4);
      }

      if (z && !z.dead) {
        z.hp -= isHeadshot ? damage * HEADSHOT_MULT : damage;
        z.punch = ZOMBIE_PUNCH_DURATION;
        if (z.hp <= 0) {
          if (isHeadshot) {
            showBigPop("HEADSHOT", "#ff3b3b");
            sfxHeadshot();
          }
          showScorePop(z.cfg.score + (isHeadshot ? 15 : 0));
          killZombie(z, isHeadshot, evaporate);
        } else {
          showScorePop(5);
          score += 5;
          scoreLabel.textContent = "Score: " + score;
        }
      }
      return true;
    } else if (obstacleHits.length > 0) {
      var oHit = obstacleHits[0];
      spawnTracer(muzzleOrigin, oHit.point, weapon.tracerColor);
      spawnImpactBurst(oHit.point, weapon.tracerColor, 8, true);
    } else {
      var farPoint = raycaster.ray.at(weapon.range, new THREE.Vector3());
      spawnTracer(muzzleOrigin, farPoint, weapon.tracerColor);
    }
    return false;
  }

  function shoot() {
    if (gameOver || fireCooldownTimer > 0) return;
    var weapon = WEAPONS[currentWeaponIndex];
    fireCooldownTimer = weapon.cooldown;

    var rgb = hexToRgbString(weapon.tracerColor);
    muzzleFlashEl.style.background = "radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(" + rgb + ",0.65) 30%, rgba(" + rgb + ",0) 68%)";
    muzzleFlashEl.classList.remove("flash");
    void muzzleFlashEl.offsetWidth; // restart animation
    muzzleFlashEl.classList.add("flash");
    triggerShake(weapon.shakeMult);
    triggerRecoil(weapon.recoil);
    weapon.sfx();

    var muzzleWorldPos = new THREE.Vector3();
    gunGroup.getWorldPosition(muzzleWorldPos);
    if (weapon.evaporate) {
      flashEnergyLight(muzzleWorldPos, weapon.tracerColor, 5.5, 8);
    } else {
      flashMuzzleLight(muzzleWorldPos, weapon.tracerColor, 4.5 * Math.max(1, weapon.pellets * 0.5));
      spawnMuzzleSmoke(muzzleWorldPos);
      spawnCasing();
    }

    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    var up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

    var anyHit = false;
    for (var p = 0; p < weapon.pellets; p++) {
      var dir = forward.clone();
      if (weapon.spread > 0) {
        dir.addScaledVector(right, (Math.random() - 0.5) * 2 * weapon.spread);
        dir.addScaledVector(up, (Math.random() - 0.5) * 2 * weapon.spread);
        dir.normalize();
      }
      if (fireRay(dir, weapon.damage)) anyHit = true;
    }

    if (anyHit) {
      crosshairEl.classList.remove("hit");
      void crosshairEl.offsetWidth;
      crosshairEl.classList.add("hit");
      sfxHit();
      sfxSquelch();
    }
  }

  function switchWeapon() {
    currentWeaponIndex = (currentWeaponIndex + 1) % WEAPONS.length;
    var weapon = WEAPONS[currentWeaponIndex];
    weaponLabelEl.textContent = weapon.name;
    updateGunVisual(weapon.visual);
    fireCooldownTimer = Math.min(fireCooldownTimer, 0.15);
    sfxSwitchWeapon();
  }

  // ---------- Lightning ability ----------
  var abilityCooldownTimer = 0;
  var lightningBtn = document.getElementById("lightningBtn");
  var lightningCooldownLabel = document.getElementById("lightningCooldownLabel");
  var lightningFlashEl = document.getElementById("lightningFlash");

  function useLightningAbility() {
    if (gameOver || abilityCooldownTimer > 0) return;
    abilityCooldownTimer = LIGHTNING_COOLDOWN;
    lightningBtn.classList.add("onCooldown");
    sfxLightning();
    triggerShake(2.5);

    lightningFlashEl.classList.remove("flash");
    void lightningFlashEl.offsetWidth;
    lightningFlashEl.classList.add("flash");

    var playerChestPos = new THREE.Vector3(player.pos.x, player.pos.y - 0.2, player.pos.z);
    flashEnergyLight(playerChestPos, LIGHTNING_NEON_COLOR, 9, LIGHTNING_RANGE + 4);
    var struck = 0;
    zombies.forEach(function (z) {
      if (z.dead) return;
      var dist = z.group.position.distanceTo(player.pos);
      if (dist > LIGHTNING_RANGE) return;

      struck++;
      var zombieChestPos = z.group.position.clone();
      zombieChestPos.y += 0.9 * z.cfg.scale;
      spawnLightningBolt(playerChestPos, zombieChestPos);

      var isHeadshot = false;
      z.hp -= LIGHTNING_DAMAGE;
      z.punch = ZOMBIE_PUNCH_DURATION;
      if (z.hp <= 0) {
        showScorePop(z.cfg.score);
        killZombie(z, isHeadshot, true, LIGHTNING_NEON_COLOR);
      } else {
        showScorePop(5);
        score += 5;
        scoreLabel.textContent = "Score: " + score;
      }
    });

    if (struck === 0) showBigPop("MISS", "#9fc9ff");
  }

  lightningBtn.addEventListener("touchstart", function (e) { e.preventDefault(); useLightningAbility(); }, { passive: false });
  lightningBtn.addEventListener("mousedown", function (e) { e.preventDefault(); useLightningAbility(); });

  // ---------- Fireball ability ----------
  var fireballCooldownTimer = 0;
  var fireballBtn = document.getElementById("fireballBtn");
  var fireballCooldownLabel = document.getElementById("fireballCooldownLabel");
  var fireballFlashEl = document.getElementById("fireballFlash");

  function useFireballAbility() {
    if (gameOver || fireballCooldownTimer > 0) return;
    fireballCooldownTimer = FIREBALL_COOLDOWN;
    fireballBtn.classList.add("onCooldown");
    sfxFireballCast();
    triggerRecoil(1.4);

    var origin = new THREE.Vector3();
    gunGroup.getWorldPosition(origin);
    var dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    origin.addScaledVector(dir, 0.4);
    spawnFireball(origin, dir);
    flashMuzzleLight(origin, NEON_FIRE, 5);
  }

  fireballBtn.addEventListener("touchstart", function (e) { e.preventDefault(); useFireballAbility(); }, { passive: false });
  fireballBtn.addEventListener("mousedown", function (e) { e.preventDefault(); useFireballAbility(); });

  // ---------- Supernova ability (ultimate): charge in slow-mo, then detonate ----------
  var supernovaCooldownTimer = 0;
  var supernovaBtn = document.getElementById("supernovaBtn");
  var supernovaCooldownLabel = document.getElementById("supernovaCooldownLabel");
  var supernovaFlashEl = document.getElementById("supernovaFlash");
  var supernovaChargeVignetteEl = document.getElementById("supernovaChargeVignette");

  function useSupernovaAbility() {
    if (gameOver || supernovaCooldownTimer > 0) return;
    supernovaCooldownTimer = SUPERNOVA_COOLDOWN;
    supernovaBtn.classList.add("onCooldown");
    sfxSupernovaCharge();
    globalTimeScale = SUPERNOVA_SLOWMO_SCALE;

    var chestPos = new THREE.Vector3(player.pos.x, player.pos.y - 0.15, player.pos.z);
    spawnImplosion(chestPos, 3.2, 26, SUPERNOVA_CORE_COLOR);
    flashEnergyLight(chestPos, SUPERNOVA_CORE_COLOR, 3, 6);

    supernovaChargeVignetteEl.classList.remove("charging");
    void supernovaChargeVignetteEl.offsetWidth;
    supernovaChargeVignetteEl.classList.add("charging");

    setTimeout(function () {
      globalTimeScale = 1;
      supernovaChargeVignetteEl.classList.remove("charging");

      sfxSupernovaBlast();
      triggerShake(4.5);
      supernovaFlashEl.classList.remove("flash");
      void supernovaFlashEl.offsetWidth;
      supernovaFlashEl.classList.add("flash");

      var blastCenter = new THREE.Vector3(player.pos.x, player.pos.y - 0.15, player.pos.z);
      spawnSupernovaBlast(blastCenter);

      var struck = 0;
      zombies.forEach(function (z) {
        if (z.dead) return;
        struck++;
        z.hp = 0;
        killZombie(z, false, true, SUPERNOVA_CORE_COLOR);
      });
      if (struck > 0) showWavePop("SUPERNOVA", "#fff2c4");
    }, SUPERNOVA_CHARGE_TIME * 1000);
  }

  supernovaBtn.addEventListener("touchstart", function (e) { e.preventDefault(); useSupernovaAbility(); }, { passive: false });
  supernovaBtn.addEventListener("mousedown", function (e) { e.preventDefault(); useSupernovaAbility(); });

  var shootBtn = document.getElementById("shootBtn");
  shootBtn.addEventListener("touchstart", function (e) { e.preventDefault(); shoot(); }, { passive: false });
  shootBtn.addEventListener("mousedown", function (e) { e.preventDefault(); shoot(); });

  var jumpBtn = document.getElementById("jumpBtn");
  jumpBtn.addEventListener("touchstart", function (e) { e.preventDefault(); wantJump = true; sfxJump(); }, { passive: false });
  jumpBtn.addEventListener("mousedown", function (e) { e.preventDefault(); wantJump = true; sfxJump(); });

  var switchWeaponBtn = document.getElementById("switchWeaponBtn");
  switchWeaponBtn.addEventListener("touchstart", function (e) { e.preventDefault(); switchWeapon(); }, { passive: false });
  switchWeaponBtn.addEventListener("mousedown", function (e) { e.preventDefault(); switchWeapon(); });

  // ---------- Player damage ----------
  function damagePlayer(amount) {
    if (gameOver) return;
    player.health = Math.max(0, player.health - amount);
    healthBarInner.style.width = (player.health / PLAYER_MAX_HEALTH * 100) + "%";
    var healthScanlines = "repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 10px), ";
    if (player.health > 40) {
      healthBarInner.style.backgroundImage = healthScanlines + "linear-gradient(90deg, #1fd6c0, #39ff7a)";
      healthBarInner.style.boxShadow = "0 0 10px rgba(57,255,122,0.8)";
    } else {
      healthBarInner.style.backgroundImage = healthScanlines + "linear-gradient(90deg, #ff2adf, #ff3b3b)";
      healthBarInner.style.boxShadow = "0 0 10px rgba(255,42,223,0.85)";
    }
    damageVignetteEl.classList.remove("hit");
    void damageVignetteEl.offsetWidth;
    damageVignetteEl.classList.add("hit");
    critVignetteEl.classList.toggle("active", player.health > 0 && player.health <= 30);
    sfxPlayerHurt();
    if (player.health <= 0) endGame();
  }

  // ---------- Game state ----------
  var gameOver = false;
  var endScreen = document.getElementById("endScreen");

  function endGame() {
    gameOver = true;
    document.getElementById("finalScore").textContent = "Final score: " + score;
    document.getElementById("finalWave").textContent = "Reached wave: " + wave;
    document.getElementById("finalKills").textContent = "Zombies killed: " + zombiesKilled;
    endScreen.style.display = "flex";
    sfxGameOver();
  }

  document.getElementById("restartBtn").addEventListener("click", function () {
    zombies.slice().forEach(function (z) { detachZombieHitbox(z); removeZombie(z); });
    bloodDecalPool.forEach(function (mesh) { mesh.visible = false; mesh.material.opacity = 0; });
    gibPool.forEach(function (g) { g.active = false; g.mesh.visible = false; });
    score = 0;
    zombiesKilled = 0;
    wave = 0;
    waveTransitioning = false;
    zombiesAliveInWave = 0;
    comboCount = 0;
    comboTimer = 0;
    currentWeaponIndex = 0;
    weaponLabelEl.textContent = WEAPONS[0].name;
    updateGunVisual(WEAPONS[0].visual);
    abilityCooldownTimer = 0;
    lightningCooldownLabel.textContent = "";
    lightningBtn.classList.remove("onCooldown");
    fireballCooldownTimer = 0;
    fireballCooldownLabel.textContent = "";
    fireballBtn.classList.remove("onCooldown");
    activeFireballs.slice().forEach(function (fb) { scene.remove(fb.mesh); fb.material.dispose(); });
    activeFireballs.length = 0;
    supernovaCooldownTimer = 0;
    supernovaCooldownLabel.textContent = "";
    supernovaBtn.classList.remove("onCooldown");
    supernovaChargeVignetteEl.classList.remove("charging");
    globalTimeScale = 1;
    player.health = PLAYER_MAX_HEALTH;
    player.pos.set(0, PLAYER_HEIGHT, 0);
    player.vy = 0;
    gameOver = false;
    scoreLabel.textContent = "Score: 0";
    healthBarInner.style.width = "100%";
    healthBarInner.style.backgroundImage = "repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 10px), linear-gradient(90deg, #1fd6c0, #39ff7a)";
    healthBarInner.style.boxShadow = "0 0 10px rgba(57,255,122,0.8)";
    critVignetteEl.classList.remove("active");
    endScreen.style.display = "none";
    startWave(1);
  });

  // ---------- Main loop ----------
  var clock = new THREE.Clock();

  function updateZombies(dt) {
    zombies.forEach(function (z) {
      var g = z.group;

      if (z.dead) {
        z.fallElapsed += dt;
        if (z.evaporating) {
          var ek = Math.min(1, z.fallElapsed / EVAPORATE_DURATION);
          g.scale.setScalar(z.cfg.scale * (1 - ek));
          g.rotation.y += dt * 6;
          var tintHex = z.evapTint;
          var tintR = ((tintHex >> 16) & 255) / 255, tintG = ((tintHex >> 8) & 255) / 255, tintB = (tintHex & 255) / 255;
          g.userData.parts.forEach(function (part) {
            part.material.emissive.setRGB(ek * tintR, ek * tintG, ek * tintB);
          });
        } else {
          var k = Math.min(1, z.fallElapsed / ZOMBIE_FALL_DURATION);
          g.rotation.x = k * (Math.PI / 2.1);
          g.position.y = -k * 0.4;
        }
        return;
      }

      z.groanTimer -= dt;
      if (z.groanTimer <= 0) {
        z.groanTimer = 3 + Math.random() * 5;
        var distToPlayer = g.position.distanceTo(player.pos);
        if (distToPlayer < 18) sfxGroan();
      }

      if (z.hp < z.maxHp * 0.6) {
        z.bleedTimer -= dt;
        if (z.bleedTimer <= 0) {
          z.bleedTimer = BLEED_INTERVAL;
          spawnBloodPool(g.position.clone().setY(0.02), 0.4 * z.cfg.scale);
        }
      }

      var toPlayer = new THREE.Vector3(player.pos.x - g.position.x, 0, player.pos.z - g.position.z);
      var dist = toPlayer.length();

      if (z.cfg.ranged && dist <= SPITTER_RANGE && dist > ZOMBIE_ATTACK_RANGE) {
        // spitters hold their distance and lob acid instead of closing in
        g.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) {
          z.attackCooldown = SPITTER_COOLDOWN;
          spawnSpit(g.position.clone().setY(0.9 * z.cfg.scale), player.pos);
          sfxSpit();
          z.punch = ZOMBIE_PUNCH_DURATION * 0.5;
        }
      } else if (dist > ZOMBIE_ATTACK_RANGE) {
        toPlayer.normalize();
        g.position.x += toPlayer.x * z.speed * dt;
        g.position.z += toPlayer.z * z.speed * dt;
        g.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
        z.bobPhase += dt * 8 * (z.speed / ZOMBIE_BASE_SPEED);
        g.position.y = Math.abs(Math.sin(z.bobPhase)) * 0.06;
        g.rotation.z = Math.sin(z.bobPhase * 0.5) * 0.08;
      } else {
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) {
          z.attackCooldown = ZOMBIE_ATTACK_COOLDOWN;
          damagePlayer(z.attackDamage);
          z.punch = ZOMBIE_PUNCH_DURATION * 0.6;
        }
      }
    });
  }

  var globalTimeScale = 1;

  function update(dt) {
    dt = Math.min(dt, 0.05) * globalTimeScale;

    updateVfx(dt);
    updateSpits(dt);
    updateFireballs(dt);
    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
    if (fireCooldownTimer > 0) {
      fireCooldownTimer = Math.max(0, fireCooldownTimer - dt);
      shootBtn.style.opacity = fireCooldownTimer > 0 ? "0.45" : "1";
    }
    if (abilityCooldownTimer > 0) {
      abilityCooldownTimer = Math.max(0, abilityCooldownTimer - dt);
      if (abilityCooldownTimer > 0) {
        lightningCooldownLabel.textContent = abilityCooldownTimer.toFixed(1) + "s";
      } else {
        lightningCooldownLabel.textContent = "";
        lightningBtn.classList.remove("onCooldown");
      }
    }
    if (fireballCooldownTimer > 0) {
      fireballCooldownTimer = Math.max(0, fireballCooldownTimer - dt);
      if (fireballCooldownTimer > 0) {
        fireballCooldownLabel.textContent = fireballCooldownTimer.toFixed(1) + "s";
      } else {
        fireballCooldownLabel.textContent = "";
        fireballBtn.classList.remove("onCooldown");
      }
    }
    if (supernovaCooldownTimer > 0) {
      supernovaCooldownTimer = Math.max(0, supernovaCooldownTimer - dt);
      if (supernovaCooldownTimer > 0) {
        supernovaCooldownLabel.textContent = supernovaCooldownTimer.toFixed(1) + "s";
      } else {
        supernovaCooldownLabel.textContent = "";
        supernovaBtn.classList.remove("onCooldown");
      }
    }
    recoilKick = Math.max(0, recoilKick - dt * 7);
    gunGroup.position.z = gunBasePos.z + recoilKick * 0.12;
    gunGroup.rotation.x = gunBaseRotX - recoilKick * 0.22;
    if (muzzleLight.intensity > 0) muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 32);
    if (energyLight.intensity > 0) energyLight.intensity = Math.max(0, energyLight.intensity - dt * 14);

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) comboCount = 0;
    }

    if (gameOver) return;

    updateZombies(dt);

    var forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).multiplyScalar(-moveVec.y);
    var right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).multiplyScalar(moveVec.x);
    var moveDir = forward.add(right);
    if (moveDir.lengthSq() > 1) moveDir.normalize();

    player.pos.x += moveDir.x * MOVE_SPEED * dt;
    player.pos.z += moveDir.z * MOVE_SPEED * dt;
    clampToArena(player.pos);

    // gravity + jump
    if (wantJump && player.grounded) {
      player.vy = JUMP_SPEED;
      player.grounded = false;
    }
    wantJump = false;
    player.vy += GRAVITY * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= PLAYER_HEIGHT) {
      player.pos.y = PLAYER_HEIGHT;
      player.vy = 0;
      player.grounded = true;
    }

    // head bob while walking on the ground
    var moveSpeed = moveDir.length();
    if (player.grounded && moveSpeed > 0.05) {
      bobPhase += dt * BOB_FREQUENCY;
    } else {
      bobPhase = 0;
    }
    var bobOffset = player.grounded ? Math.sin(bobPhase) * BOB_AMOUNT * moveSpeed : 0;

    camera.position.set(player.pos.x, player.pos.y + bobOffset, player.pos.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if (shakeTime > 0) {
      var shakeAmt = (shakeTime / SHAKE_DURATION) * SHAKE_MAGNITUDE * shakeMagMult;
      camera.rotation.y += (Math.random() - 0.5) * shakeAmt;
      camera.rotation.x += (Math.random() - 0.5) * shakeAmt;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    update(dt);
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById("loading").style.display = "none";
  startWave(1);
  animate();
})();
</script>
</body>
