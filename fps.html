<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Range Shooter Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #202634;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 2px rgba(0,0,0,0.7);
  }
  #crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-1px); }
  #crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
  #crosshair.hit {
    animation: crosshairPop 180ms ease-out;
  }
  #crosshair.hit::before, #crosshair.hit::after { background: #ff4d4d; }
  @keyframes crosshairPop {
    0% { transform: translate(-50%, -50%) scale(1.8); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #muzzleFlash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 260px;
    height: 260px;
    margin-left: -130px;
    margin-top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,235,150,0.55) 0%, rgba(255,180,60,0.25) 35%, rgba(255,180,60,0) 70%);
    opacity: 0;
  }
  #muzzleFlash.flash {
    animation: muzzleFlashAnim 100ms ease-out;
  }
  @keyframes muzzleFlashAnim {
    0% { opacity: 1; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  .scorePop {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #ffe066;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: scorePopAnim 600ms ease-out forwards;
  }
  @keyframes scorePopAnim {
    0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    100% { opacity: 0; transform: translate(-50%, -90px) translateY(0); }
  }

  #joystick {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto;
    touch-action: none;
  }
  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(255,255,255,0.8);
  }

  #lookPad {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 55%;
    height: 65%;
    pointer-events: auto;
    touch-action: none;
  }

  #shootBtn {
    position: absolute;
    right: 30px;
    bottom: 150px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(220, 40, 40, 0.55);
    border: 3px solid rgba(255,255,255,0.75);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 80ms linear;
  }

  #jumpBtn {
    position: absolute;
    left: 150px;
    bottom: 40px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.55);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }

  #topBar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 140px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 16px;
    font-weight: 600;
  }

  #hint {
    position: absolute;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 12px;
    text-align: center;
    max-width: 80%;
  }

  #backLink {
    position: absolute;
    top: 12px;
    right: 12px;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 4px 8px;
    pointer-events: auto;
  }

  #endScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    z-index: 50;
    pointer-events: auto;
    text-align: center;
    padding: 20px;
  }
  #endScreen h1 { font-size: 28px; margin: 0 0 8px; }
  #endScreen p { font-size: 16px; margin: 4px 0; opacity: 0.85; }
  #restartBtn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #4caf50;
    color: #fff;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #202634;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    z-index: 100;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="loading">Loading range...</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="muzzleFlash"></div>
  <div id="topBar">
    <div id="scoreLabel">Score: 0</div>
    <div id="timeLabel">Time: 60</div>
  </div>
  <div id="hint">Left pad: move &middot; Right side: look &middot; &uarr;: jump &middot; Red button: shoot</div>
  <a id="backLink" href="index.html">&larr; Builder demo</a>

  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookPad"></div>
  <div id="jumpBtn">&#8593;</div>
  <div id="shootBtn">SHOOT</div>
</div>

<div id="endScreen">
  <h1>Time's up!</h1>
  <p id="finalScore">Final score: 0</p>
  <p id="finalAccuracy">Accuracy: 0%</p>
  <button id="restartBtn">Play again</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  var GRAVITY = -18;
  var JUMP_SPEED = 6.5;
  var MOVE_SPEED = 5;
  var PLAYER_HEIGHT = 1.7;
  var ARENA_HALF = 22;
  var TARGET_COUNT = 6;
  var ROUND_SECONDS = 60;
  var SHOOT_RANGE = 60;
  var TARGET_PUNCH_DURATION = 0.18;
  var FIRE_COOLDOWN = 0.28;
  var BOB_FREQUENCY = 9;
  var BOB_AMOUNT = 0.045;

  // ---------- Scene setup ----------
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fb8d8);
  scene.fog = new THREE.Fog(0x8fb8d8, 25, 70);

  var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
  scene.add(camera);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.8);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(20, 40, 15);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -ARENA_HALF - 5;
  sun.shadow.camera.right = ARENA_HALF + 5;
  sun.shadow.camera.top = ARENA_HALF + 5;
  sun.shadow.camera.bottom = -ARENA_HALF - 5;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 100;
  sun.shadow.bias = -0.002;
  scene.add(sun);

  // ---------- Procedural textures (no external assets) ----------
  function makeCanvasTexture(size, draw) {
    var canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    draw(canvas.getContext("2d"), size);
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  var groundTexture = makeCanvasTexture(256, function (ctx, size) {
    ctx.fillStyle = "#5f8a45";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.08)";
    ctx.lineWidth = 2;
    var cell = size / 8;
    for (var i = 0; i <= 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, size);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cell);
      ctx.lineTo(size, i * cell);
      ctx.stroke();
    }
    for (var s = 0; s < 400; s++) {
      ctx.fillStyle = "rgba(0,0,0,0.04)";
      ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
    }
  });
  groundTexture.repeat.set(ARENA_HALF / 2, ARENA_HALF / 2);

  var wallTexture = makeCanvasTexture(128, function (ctx, size) {
    ctx.fillStyle = "#5a6472";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 3;
    for (var i = 0; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * (size / 4));
      ctx.lineTo(size, i * (size / 4));
      ctx.stroke();
    }
  });
  wallTexture.repeat.set(4, 1.5);

  var crateTexture = makeCanvasTexture(128, function (ctx, size) {
    ctx.fillStyle = "#9b6b3c";
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 4;
    ctx.strokeRect(6, 6, size - 12, size - 12);
    ctx.beginPath();
    ctx.moveTo(6, 6);
    ctx.lineTo(size - 6, size - 6);
    ctx.moveTo(size - 6, 6);
    ctx.lineTo(6, size - 6);
    ctx.stroke();
  });

  // ---------- Arena ----------
  var groundGeo = new THREE.PlaneGeometry(ARENA_HALF * 2, ARENA_HALF * 2);
  var groundMat = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.95, metalness: 0 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  var obstacles = [ground];

  var wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.85, metalness: 0.05 });
  var wallHeight = 6;
  var wallThickness = 1;
  function addWall(x, z, w, d) {
    var geo = new THREE.BoxGeometry(w, wallHeight, d);
    var mesh = new THREE.Mesh(geo, wallMat);
    mesh.position.set(x, wallHeight / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push(mesh);
  }
  addWall(0, -ARENA_HALF, ARENA_HALF * 2 + wallThickness, wallThickness);
  addWall(0, ARENA_HALF, ARENA_HALF * 2 + wallThickness, wallThickness);
  addWall(-ARENA_HALF, 0, wallThickness, ARENA_HALF * 2 + wallThickness);
  addWall(ARENA_HALF, 0, wallThickness, ARENA_HALF * 2 + wallThickness);

  // a few crate obstacles for visual interest
  var crateMat = new THREE.MeshStandardMaterial({ map: crateTexture, roughness: 0.8, metalness: 0 });
  [[-8, -4], [6, 5], [-3, 10], [10, -9]].forEach(function (p) {
    var crate = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), crateMat);
    crate.position.set(p[0], 1, p[1]);
    crate.castShadow = true;
    crate.receiveShadow = true;
    scene.add(crate);
    obstacles.push(crate);
  });

  // ---------- Targets: humanoid silhouettes ----------
  var targets = [];
  var targetHitMeshes = [];
  var shirtColors = [0xc0392b, 0x2e6da4, 0x27ae60, 0xb8860b, 0x8e44ad, 0xd35400];

  function randomTargetPosition() {
    var margin = 3;
    var x = (Math.random() * 2 - 1) * (ARENA_HALF - margin);
    var z = (Math.random() * 2 - 1) * (ARENA_HALF - margin);
    return new THREE.Vector3(x, 0, z);
  }

  function createHumanTarget(colorHex) {
    var group = new THREE.Group();

    var skinMat = new THREE.MeshStandardMaterial({ color: 0xd8a878, roughness: 0.8 });
    var shirtMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7 });
    var pantsMat = new THREE.MeshStandardMaterial({ color: 0x33383f, roughness: 0.7 });

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), skinMat);
    head.position.y = 1.6;

    var torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.75, 0.32), shirtMat);
    torso.position.y = 1.02;

    var hips = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.3), pantsMat);
    hips.position.y = 0.47;

    var legGeo = new THREE.BoxGeometry(0.2, 0.85, 0.24);
    var legL = new THREE.Mesh(legGeo, pantsMat);
    legL.position.set(-0.15, -0.06, 0);
    var legR = new THREE.Mesh(legGeo, pantsMat);
    legR.position.set(0.15, -0.06, 0);

    var armGeo = new THREE.BoxGeometry(0.18, 0.68, 0.2);
    var armL = new THREE.Mesh(armGeo, shirtMat);
    armL.position.set(-0.42, 1.05, 0);
    var armR = new THREE.Mesh(armGeo, shirtMat);
    armR.position.set(0.42, 1.05, 0);

    [head, torso, hips, legL, legR, armL, armR].forEach(function (part) {
      part.castShadow = true;
      part.receiveShadow = true;
      group.add(part);
      part.userData.rootTarget = group;
      targetHitMeshes.push(part);
    });

    group.userData.punch = 0;
    group.userData.parts = [head, torso, hips, legL, legR, armL, armR];
    return group;
  }

  function spawnTarget() {
    var color = shirtColors[targets.length % shirtColors.length];
    var group = createHumanTarget(color);
    group.position.copy(randomTargetPosition());
    scene.add(group);
    targets.push(group);
  }

  function respawnTarget(group) {
    group.position.copy(randomTargetPosition());
    group.visible = true;
  }

  for (var i = 0; i < TARGET_COUNT; i++) spawnTarget();

  // ---------- Player physics ----------
  var player = {
    pos: new THREE.Vector3(0, PLAYER_HEIGHT, 12),
    vy: 0,
    grounded: true,
    yaw: 0,
    pitch: -0.05
  };
  var wantJump = false;
  var bobPhase = 0;

  function clampToArena(pos) {
    var margin = 0.8;
    pos.x = Math.max(-ARENA_HALF + margin, Math.min(ARENA_HALF - margin, pos.x));
    pos.z = Math.max(-ARENA_HALF + margin, Math.min(ARENA_HALF - margin, pos.z));
  }

  // ---------- Input: joystick ----------
  var joystickEl = document.getElementById("joystick");
  var joystickKnob = document.getElementById("joystickKnob");
  var moveVec = { x: 0, y: 0 };
  var joystickTouchId = null;
  var joystickCenter = { x: 0, y: 0 };
  var JOYSTICK_MAX = 40;

  function joystickStart(id, clientX, clientY) {
    joystickTouchId = id;
    var rect = joystickEl.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    joystickMove(clientX, clientY);
  }
  function joystickMove(clientX, clientY) {
    var dx = clientX - joystickCenter.x;
    var dy = clientY - joystickCenter.y;
    var dist = Math.min(JOYSTICK_MAX, Math.sqrt(dx * dx + dy * dy));
    var angle = Math.atan2(dy, dx);
    var kx = Math.cos(angle) * dist;
    var ky = Math.sin(angle) * dist;
    joystickKnob.style.transform = "translate(" + kx + "px," + ky + "px)";
    moveVec.x = kx / JOYSTICK_MAX;
    moveVec.y = ky / JOYSTICK_MAX;
  }
  function joystickEnd() {
    joystickTouchId = null;
    moveVec.x = 0; moveVec.y = 0;
    joystickKnob.style.transform = "translate(0,0)";
  }

  joystickEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joystickStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  joystickEl.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) joystickMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  joystickEl.addEventListener("touchend", function (e) { e.preventDefault(); joystickEnd(); }, { passive: false });
  joystickEl.addEventListener("touchcancel", joystickEnd);

  var mouseJoystickDown = false;
  joystickEl.addEventListener("mousedown", function (e) {
    mouseJoystickDown = true;
    joystickStart("mouse", e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", function (e) {
    if (mouseJoystickDown) joystickMove(e.clientX, e.clientY);
    if (lookDown) lookMove(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", function () {
    if (mouseJoystickDown) { mouseJoystickDown = false; joystickEnd(); }
    lookDown = false;
  });

  // ---------- Input: look pad ----------
  var lookPad = document.getElementById("lookPad");
  var lookTouchId = null;
  var lookDown = false;
  var lastLook = { x: 0, y: 0 };
  var LOOK_SENSITIVITY = 0.006;

  function lookStart(id, x, y) {
    lookDown = true;
    lookTouchId = id;
    lastLook.x = x; lastLook.y = y;
  }
  function lookMove(x, y) {
    var dx = x - lastLook.x;
    var dy = y - lastLook.y;
    lastLook.x = x; lastLook.y = y;
    player.yaw -= dx * LOOK_SENSITIVITY;
    player.pitch -= dy * LOOK_SENSITIVITY;
    var maxPitch = Math.PI / 2 - 0.05;
    player.pitch = Math.max(-maxPitch, Math.min(maxPitch, player.pitch));
  }

  lookPad.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    lookStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  lookPad.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === lookTouchId) lookMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  lookPad.addEventListener("touchend", function (e) {
    e.preventDefault();
    lookDown = false; lookTouchId = null;
  }, { passive: false });
  lookPad.addEventListener("mousedown", function (e) {
    lookStart("mouse", e.clientX, e.clientY);
  });

  // ---------- Gun viewmodel ----------
  var gunGroup = new THREE.Group();
  var gunBasePos = new THREE.Vector3(0.1, -0.27, -1.1);
  var gunBaseRotX = 0.02;
  gunGroup.position.copy(gunBasePos);
  gunGroup.rotation.x = gunBaseRotX;
  gunGroup.rotation.y = -0.12;
  camera.add(gunGroup);

  var gunMetalMat = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.4, metalness: 0.6 });
  var gunGripMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.1 });

  var gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.22), gunMetalMat);
  gunBody.position.set(0, 0, 0);
  gunGroup.add(gunBody);

  var gunBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.024, 0.12), gunMetalMat);
  gunBarrel.position.set(0, 0.01, -0.17);
  gunGroup.add(gunBarrel);

  var gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.11, 0.048), gunGripMat);
  gunGrip.position.set(0, -0.07, 0.06);
  gunGrip.rotation.x = 0.25;
  gunGroup.add(gunGrip);

  var gunSight = new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.016, 0.016), gunMetalMat);
  gunSight.position.set(0, 0.043, -0.05);
  gunGroup.add(gunSight);

  var recoilKick = 0;
  function triggerRecoil() {
    recoilKick = 1;
  }

  // ---------- VFX: tracers, impact particles, screen shake ----------
  var vfxGroup = new THREE.Group();
  scene.add(vfxGroup);

  var tracers = []; // { line, life, maxLife }
  var tracerMat = new THREE.LineBasicMaterial({ color: 0xfff2b0, transparent: true, opacity: 0.9 });

  function spawnTracer(from, to) {
    var geo = new THREE.BufferGeometry().setFromPoints([from, to]);
    var line = new THREE.Line(geo, tracerMat.clone());
    vfxGroup.add(line);
    tracers.push({ line: line, life: 0.08, maxLife: 0.08 });
  }

  var PARTICLE_POOL_SIZE = 40;
  var particlePool = [];
  var particleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
  for (var pi = 0; pi < PARTICLE_POOL_SIZE; pi++) {
    var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    var pMesh = new THREE.Mesh(particleGeo, pMat);
    pMesh.visible = false;
    vfxGroup.add(pMesh);
    particlePool.push({ mesh: pMesh, vel: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextParticleIndex = 0;

  function spawnImpactBurst(position, color, count) {
    for (var n = 0; n < count; n++) {
      var p = particlePool[nextParticleIndex];
      nextParticleIndex = (nextParticleIndex + 1) % PARTICLE_POOL_SIZE;
      p.active = true;
      p.mesh.visible = true;
      p.mesh.position.copy(position);
      p.mesh.material.color.setHex(color);
      p.mesh.material.opacity = 1;
      var speed = 1.5 + Math.random() * 2.5;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI * 0.6;
      p.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed + 1,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      p.life = 0.35 + Math.random() * 0.25;
      p.maxLife = p.life;
    }
  }

  function updateVfx(dt) {
    for (var ti = tracers.length - 1; ti >= 0; ti--) {
      var tr = tracers[ti];
      tr.life -= dt;
      tr.line.material.opacity = Math.max(0, tr.life / tr.maxLife) * 0.9;
      if (tr.life <= 0) {
        vfxGroup.remove(tr.line);
        tr.line.geometry.dispose();
        tr.line.material.dispose();
        tracers.splice(ti, 1);
      }
    }

    for (var qi = 0; qi < particlePool.length; qi++) {
      var part = particlePool[qi];
      if (!part.active) continue;
      part.life -= dt;
      if (part.life <= 0) {
        part.active = false;
        part.mesh.visible = false;
        continue;
      }
      part.vel.y -= 9 * dt;
      part.mesh.position.addScaledVector(part.vel, dt);
      part.mesh.material.opacity = Math.max(0, part.life / part.maxLife);
    }

    targets.forEach(function (group) {
      if (group.userData.punch > 0) {
        group.userData.punch -= dt;
        var k = Math.max(0, group.userData.punch / TARGET_PUNCH_DURATION);
        group.scale.setScalar(1 + k * 0.9);
        group.userData.parts.forEach(function (part) { part.material.emissive.setScalar(k); });
      } else if (group.scale.x !== 1) {
        group.scale.setScalar(1);
      }
    });
  }

  var shakeTime = 0;
  var SHAKE_DURATION = 0.14;
  var SHAKE_MAGNITUDE = 0.03;
  function triggerShake() {
    shakeTime = SHAKE_DURATION;
  }

  // ---------- Shooting ----------
  var score = 0;
  var shotsFired = 0;
  var shotsHit = 0;
  var raycaster = new THREE.Raycaster();
  var crosshairEl = document.getElementById("crosshair");
  var muzzleFlashEl = document.getElementById("muzzleFlash");
  var scoreLabel = document.getElementById("scoreLabel");
  var hudEl = document.getElementById("hud");

  function showScorePop() {
    var el = document.createElement("div");
    el.className = "scorePop";
    el.textContent = "+10";
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 650);
  }

  var fireCooldownTimer = 0;

  function shoot() {
    if (gameOver || fireCooldownTimer > 0) return;
    fireCooldownTimer = FIRE_COOLDOWN;
    shotsFired++;

    muzzleFlashEl.classList.remove("flash");
    void muzzleFlashEl.offsetWidth; // restart animation
    muzzleFlashEl.classList.add("flash");
    triggerShake();
    triggerRecoil();

    var muzzleOrigin = camera.position.clone();
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    raycaster.far = SHOOT_RANGE;

    var targetHits = raycaster.intersectObjects(targetHitMeshes);
    var obstacleHits = raycaster.intersectObjects(obstacles);
    var targetDist = targetHits.length > 0 ? targetHits[0].distance : Infinity;
    var obstacleDist = obstacleHits.length > 0 ? obstacleHits[0].distance : Infinity;

    if (targetHits.length > 0 && targetDist < obstacleDist) {
      var hit = targetHits[0];
      var hitGroup = hit.object.userData.rootTarget;
      shotsHit++;
      score += 10;
      scoreLabel.textContent = "Score: " + score;
      crosshairEl.classList.remove("hit");
      void crosshairEl.offsetWidth;
      crosshairEl.classList.add("hit");
      showScorePop();

      spawnTracer(muzzleOrigin, hit.point);
      spawnImpactBurst(hit.point, 0xff6644, 14);
      hitGroup.userData.punch = TARGET_PUNCH_DURATION;
      setTimeout(function () {
        respawnTarget(hitGroup);
      }, TARGET_PUNCH_DURATION * 1000);
    } else if (obstacleHits.length > 0) {
      var oHit = obstacleHits[0];
      spawnTracer(muzzleOrigin, oHit.point);
      spawnImpactBurst(oHit.point, 0xcccccc, 8);
    } else {
      var farPoint = raycaster.ray.at(SHOOT_RANGE, new THREE.Vector3());
      spawnTracer(muzzleOrigin, farPoint);
    }
  }

  var shootBtn = document.getElementById("shootBtn");
  shootBtn.addEventListener("touchstart", function (e) { e.preventDefault(); shoot(); }, { passive: false });
  shootBtn.addEventListener("mousedown", function (e) { e.preventDefault(); shoot(); });

  var jumpBtn = document.getElementById("jumpBtn");
  jumpBtn.addEventListener("touchstart", function (e) { e.preventDefault(); wantJump = true; }, { passive: false });
  jumpBtn.addEventListener("mousedown", function (e) { e.preventDefault(); wantJump = true; });

  // ---------- Timer / game state ----------
  var timeLeft = ROUND_SECONDS;
  var gameOver = false;
  var timeLabel = document.getElementById("timeLabel");
  var endScreen = document.getElementById("endScreen");

  var timerInterval = setInterval(function () {
    if (gameOver) return;
    timeLeft--;
    timeLabel.textContent = "Time: " + Math.max(0, timeLeft);
    if (timeLeft <= 0) {
      endRound();
    }
  }, 1000);

  function endRound() {
    gameOver = true;
    var accuracy = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
    document.getElementById("finalScore").textContent = "Final score: " + score;
    document.getElementById("finalAccuracy").textContent = "Accuracy: " + accuracy + "% (" + shotsHit + "/" + shotsFired + ")";
    endScreen.style.display = "flex";
  }

  document.getElementById("restartBtn").addEventListener("click", function () {
    score = 0;
    shotsFired = 0;
    shotsHit = 0;
    timeLeft = ROUND_SECONDS;
    gameOver = false;
    scoreLabel.textContent = "Score: 0";
    timeLabel.textContent = "Time: " + ROUND_SECONDS;
    endScreen.style.display = "none";
    targets.forEach(respawnTarget);
  });

  // ---------- Main loop ----------
  var clock = new THREE.Clock();

  function update(dt) {
    dt = Math.min(dt, 0.05);

    updateVfx(dt);
    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
    if (fireCooldownTimer > 0) {
      fireCooldownTimer = Math.max(0, fireCooldownTimer - dt);
      shootBtn.style.opacity = fireCooldownTimer > 0 ? "0.45" : "1";
    }
    recoilKick = Math.max(0, recoilKick - dt * 7);
    gunGroup.position.z = gunBasePos.z + recoilKick * 0.12;
    gunGroup.rotation.x = gunBaseRotX - recoilKick * 0.22;

    if (gameOver) return;

    var forward = new THREE.Vector3(Math.sin(player.yaw), 0, -Math.cos(player.yaw)).multiplyScalar(-moveVec.y);
    var right = new THREE.Vector3(Math.cos(player.yaw), 0, Math.sin(player.yaw)).multiplyScalar(moveVec.x);
    var moveDir = forward.add(right);
    if (moveDir.lengthSq() > 1) moveDir.normalize();

    player.pos.x += moveDir.x * MOVE_SPEED * dt;
    player.pos.z += moveDir.z * MOVE_SPEED * dt;
    clampToArena(player.pos);

    // gravity + jump
    if (wantJump && player.grounded) {
      player.vy = JUMP_SPEED;
      player.grounded = false;
    }
    wantJump = false;
    player.vy += GRAVITY * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= PLAYER_HEIGHT) {
      player.pos.y = PLAYER_HEIGHT;
      player.vy = 0;
      player.grounded = true;
    }

    // head bob while walking on the ground
    var moveSpeed = moveDir.length();
    if (player.grounded && moveSpeed > 0.05) {
      bobPhase += dt * BOB_FREQUENCY;
    } else {
      bobPhase = 0;
    }
    var bobOffset = player.grounded ? Math.sin(bobPhase) * BOB_AMOUNT * moveSpeed : 0;

    // idle sway for target life-likeness
    var t = clock.elapsedTime;
    targets.forEach(function (group, idx) {
      if (group.userData.punch <= 0) {
        group.rotation.y = Math.sin(t * 1.2 + idx) * 0.1;
      }
    });

    camera.position.set(player.pos.x, player.pos.y + bobOffset, player.pos.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if (shakeTime > 0) {
      var shakeAmt = (shakeTime / SHAKE_DURATION) * SHAKE_MAGNITUDE;
      camera.rotation.y += (Math.random() - 0.5) * shakeAmt;
      camera.rotation.x += (Math.random() - 0.5) * shakeAmt;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    update(dt);
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById("loading").style.display = "none";
  animate();
})();
</script>
</body>
</html>
