<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Skyblast Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #0a1a3a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 3px rgba(0,0,0,0.7);
  }
  #crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-1px); }
  #crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
  #crosshair.hit {
    animation: crosshairPop 180ms ease-out;
  }
  #crosshair.hit::before, #crosshair.hit::after { background: #5aa0a8; }
  @keyframes crosshairPop {
    0% { transform: translate(-50%, -50%) scale(1.8); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #muzzleFlash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 260px;
    height: 260px;
    margin-left: -130px;
    margin-top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150,200,205,0.45) 0%, rgba(110,160,170,0.2) 35%, rgba(110,160,170,0) 70%);
    opacity: 0;
  }
  #muzzleFlash.flash {
    animation: muzzleFlashAnim 100ms ease-out;
  }
  @keyframes muzzleFlashAnim {
    0% { opacity: 1; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  #speedLines {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 150ms ease-out;
    background:
      repeating-conic-gradient(
        from 0deg,
        rgba(255,255,255,0.09) 0deg 2deg,
        rgba(255,255,255,0) 2deg 12deg
      );
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 18%, black 62%);
    mask-image: radial-gradient(circle at 50% 50%, transparent 18%, black 62%);
  }

  .scorePop {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #5aa0a8;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    animation: scorePopAnim 600ms ease-out forwards;
  }
  @keyframes scorePopAnim {
    0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    100% { opacity: 0; transform: translate(-50%, -90px) translateY(0); }
  }

  #joystick {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto;
    touch-action: none;
  }
  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(255,255,255,0.8);
  }

  #lookPad {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 55%;
    height: 65%;
    pointer-events: auto;
    touch-action: none;
  }

  #shootBtn {
    position: absolute;
    right: 30px;
    bottom: 150px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(60, 160, 255, 0.55);
    border: 3px solid rgba(255,255,255,0.75);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 80ms linear;
  }

  #boostBtn {
    position: absolute;
    left: 150px;
    bottom: 40px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255, 200, 60, 0.3);
    border: 2px solid rgba(255,220,120,0.7);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
  }
  #boostBtn.active {
    background: rgba(255, 200, 60, 0.65);
  }

  #topBar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 190px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 16px;
    font-weight: 600;
  }

  #hint {
    position: absolute;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    font-size: 12px;
    text-align: center;
    max-width: 85%;
  }

  #gameNav {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
    pointer-events: auto;
  }
  .navLink, .navCurrent {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 4px 7px;
  }
  .navCurrent {
    background: rgba(255,255,255,0.28);
    font-weight: 700;
  }

  #endScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    z-index: 50;
    pointer-events: auto;
    text-align: center;
    padding: 20px;
  }
  #endScreen h1 { font-size: 28px; margin: 0 0 8px; }
  #endScreen p { font-size: 16px; margin: 4px 0; opacity: 0.85; }
  #restartBtn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #3ca0ff;
    color: #fff;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #0a1a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    z-index: 100;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="loading">Loading sky arena...</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="muzzleFlash"></div>
  <div id="speedLines"></div>
  <div id="topBar">
    <div id="scoreLabel">Score: 0</div>
    <div id="timeLabel">Time: 60</div>
  </div>
  <div id="hint">Left pad: fly forward/strafe &middot; Right side: aim &middot; Gold: boost &middot; Blue: blast</div>
  <div id="gameNav">
    <a class="navLink" href="index.html">Builder</a>
    <a class="navLink" href="fps.html">Range</a>
    <span class="navCurrent">Powers</span>
  </div>

  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookPad"></div>
  <div id="boostBtn">BOOST</div>
  <div id="shootBtn">BLAST</div>
</div>

<div id="endScreen">
  <h1>Time's up!</h1>
  <p id="finalScore">Final score: 0</p>
  <p id="finalAccuracy">Accuracy: 0%</p>
  <button id="restartBtn">Play again</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  var ARENA_RADIUS = 55;
  var FLIGHT_SPEED = 11;
  var BOOST_MULTIPLIER = 2.1;
  var TARGET_COUNT = 9;
  var ROUND_SECONDS = 60;
  var BLAST_SPEED = 38;
  var BLAST_LIFETIME = 2.2;
  var BLAST_HIT_RADIUS = 1.3;
  var FIRE_COOLDOWN = 0.22;
  var TARGET_PUNCH_DURATION = 0.18;

  // ---------- Sound (synthesized, no audio files) ----------
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, freqEnd, duration, type, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playNoiseBurst(duration, filterFreq, volume) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.value = volume;
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

  function sfxBlast() { playTone(760, 180, 0.11, "sawtooth", 0.16); }
  function sfxHit() { playNoiseBurst(0.1, 1400, 0.22); playTone(500, 900, 0.08, "sine", 0.12); }
  function sfxBoost() { playTone(220, 520, 0.28, "triangle", 0.14); }
  function sfxRoundEnd() { playTone(520, 260, 0.5, "sine", 0.15); }

  // ---------- Scene setup ----------
  var scene = new THREE.Scene();
  var horizonColor = 0xcfe6ff;
  var fogColor = 0xaed4f5;
  scene.fog = new THREE.Fog(fogColor, 55, 150);

  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
  scene.add(camera);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var hemi = new THREE.HemisphereLight(0xffffff, 0x3a6ea5, 1.0);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff6e0, 1.3);
  sun.position.set(60, 90, 30);
  scene.add(sun);

  // ---------- Sky dome: vertical gradient + sun glow + clouds ----------
  function makeCanvasTexture(w, h, draw) {
    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    draw(canvas.getContext("2d"), w, h);
    return new THREE.CanvasTexture(canvas);
  }

  var skyTexture = makeCanvasTexture(2, 256, function (ctx, w, h) {
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#4d76a8");
    grad.addColorStop(0.55, "#93aec4");
    grad.addColorStop(1, "#e9edf0");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  });
  var skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(280, 24, 16),
    new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  scene.add(skyDome);

  var sunTexture = makeCanvasTexture(128, 128, function (ctx, w, h) {
    var grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grad.addColorStop(0, "rgba(255,250,230,1)");
    grad.addColorStop(0.25, "rgba(255,240,190,0.9)");
    grad.addColorStop(1, "rgba(255,230,150,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  });
  var sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTexture, depthWrite: false, fog: false }));
  sunSprite.scale.set(70, 70, 1);
  var sunDir = new THREE.Vector3(60, 90, 30).normalize();
  sunSprite.position.copy(sunDir.multiplyScalar(260));
  scene.add(sunSprite);

  var cloudTexture = makeCanvasTexture(128, 64, function (ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    for (var c = 0; c < 5; c++) {
      var cx = 20 + Math.random() * (w - 40);
      var cy = h / 2 + (Math.random() * 10 - 5);
      var r = 14 + Math.random() * 12;
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, "rgba(255,255,255,0.9)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  var cloudMat = new THREE.SpriteMaterial({ map: cloudTexture, transparent: true, opacity: 0.85, fog: true, depthWrite: false });
  var clouds = [];
  for (var ci = 0; ci < 16; ci++) {
    var cloud = new THREE.Sprite(cloudMat);
    var cr = 40 + Math.random() * 90;
    var ct = Math.random() * Math.PI * 2;
    cloud.position.set(Math.cos(ct) * cr, 20 + Math.random() * 45, Math.sin(ct) * cr);
    var cs = 18 + Math.random() * 22;
    cloud.scale.set(cs, cs * 0.5, 1);
    scene.add(cloud);
    clouds.push({ sprite: cloud, driftSpeed: 0.3 + Math.random() * 0.4 });
  }

  var ringMat = new THREE.MeshStandardMaterial({ color: 0x5a7fa0, emissive: 0x142d47, roughness: 0.5, metalness: 0.25 });
  var rings = [];
  for (var ri = 0; ri < 6; ri++) {
    var ringGeo = new THREE.TorusGeometry(4 + Math.random() * 2, 0.3, 8, 24);
    var ring = new THREE.Mesh(ringGeo, ringMat);
    var rr = 15 + Math.random() * 30;
    var rt = Math.random() * Math.PI * 2;
    ring.position.set(Math.cos(rt) * rr, -5 + Math.random() * 30, Math.sin(rt) * rr);
    ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    scene.add(ring);
    rings.push(ring);
  }

  // distant ground far below, just for visual reference/horizon
  var groundMat = new THREE.MeshStandardMaterial({ color: 0x3a6b45, roughness: 1 });
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -40;
  scene.add(ground);

  // ---------- Targets: energy crystal drones (core + rotating shell) ----------
  var targets = [];
  var orbColors = [0x4a78ad, 0xa85a52, 0x5a9ba0, 0xb8924a, 0x7a6690];

  function randomTargetPosition() {
    var r = 12 + Math.random() * (ARENA_RADIUS - 14);
    var theta = Math.random() * Math.PI * 2;
    var y = -5 + Math.random() * 35;
    return new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r);
  }

  var shardGeo = new THREE.ConeGeometry(0.12, 0.4, 4);
  function addShards(group, coreMat) {
    var shards = [];
    for (var s = 0; s < 4; s++) {
      var shard = new THREE.Mesh(shardGeo, coreMat);
      var axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      shard.position.copy(axis.clone().multiplyScalar(0.65));
      shard.lookAt(shard.position.clone().add(axis));
      group.add(shard);
      shards.push(shard);
    }
    return shards;
  }

  function spawnTarget() {
    var color = orbColors[targets.length % orbColors.length];
    var group = new THREE.Group();

    var coreMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.45, roughness: 0.4 });
    var core = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 14), coreMat);
    group.add(core);

    var shellMat = new THREE.MeshStandardMaterial({
      color: color, emissive: color, emissiveIntensity: 0.18, roughness: 0.4,
      wireframe: true, transparent: true, opacity: 0.75
    });
    var shell = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95, 1), shellMat);
    group.add(shell);

    var shards = addShards(group, coreMat);

    var light = new THREE.PointLight(color, 0.6, 7);
    group.add(light);

    group.position.copy(randomTargetPosition());
    group.userData.punch = 0;
    group.userData.coreMat = coreMat;
    group.userData.core = core;
    group.userData.shell = shell;
    group.userData.shards = shards;
    group.userData.light = light;
    group.userData.baseCoreEmissive = 0.45;
    group.userData.baseShellEmissive = 0.18;
    scene.add(group);
    targets.push(group);
  }

  function respawnTarget(group) {
    group.position.copy(randomTargetPosition());
    group.visible = true;
    if (group.userData.shards.length === 0) {
      group.userData.shards = addShards(group, group.userData.coreMat);
    }
  }

  for (var ti = 0; ti < TARGET_COUNT; ti++) spawnTarget();

  // ---------- Player flight ----------
  var player = {
    pos: new THREE.Vector3(0, 5, 30),
    yaw: 0,
    pitch: -0.1
  };
  var contrailTimer = 0;

  function clampToArena(pos) {
    var maxR = ARENA_RADIUS - 2;
    var horiz = Math.sqrt(pos.x * pos.x + pos.z * pos.z);
    if (horiz > maxR) {
      var k = maxR / horiz;
      pos.x *= k;
      pos.z *= k;
    }
    pos.y = Math.max(-10, Math.min(60, pos.y));
  }

  // ---------- Input: joystick ----------
  var joystickEl = document.getElementById("joystick");
  var joystickKnob = document.getElementById("joystickKnob");
  var moveVec = { x: 0, y: 0 };
  var joystickTouchId = null;
  var joystickCenter = { x: 0, y: 0 };
  var JOYSTICK_MAX = 40;

  function joystickStart(id, clientX, clientY) {
    joystickTouchId = id;
    var rect = joystickEl.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    joystickMove(clientX, clientY);
  }
  function joystickMove(clientX, clientY) {
    var dx = clientX - joystickCenter.x;
    var dy = clientY - joystickCenter.y;
    var dist = Math.min(JOYSTICK_MAX, Math.sqrt(dx * dx + dy * dy));
    var angle = Math.atan2(dy, dx);
    var kx = Math.cos(angle) * dist;
    var ky = Math.sin(angle) * dist;
    joystickKnob.style.transform = "translate(" + kx + "px," + ky + "px)";
    moveVec.x = kx / JOYSTICK_MAX;
    moveVec.y = ky / JOYSTICK_MAX;
  }
  function joystickEnd() {
    joystickTouchId = null;
    moveVec.x = 0; moveVec.y = 0;
    joystickKnob.style.transform = "translate(0,0)";
  }

  joystickEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joystickStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  joystickEl.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joystickTouchId) joystickMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  joystickEl.addEventListener("touchend", function (e) { e.preventDefault(); joystickEnd(); }, { passive: false });
  joystickEl.addEventListener("touchcancel", joystickEnd);

  var mouseJoystickDown = false;
  joystickEl.addEventListener("mousedown", function (e) {
    mouseJoystickDown = true;
    joystickStart("mouse", e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", function (e) {
    if (mouseJoystickDown) joystickMove(e.clientX, e.clientY);
    if (lookDown) lookMove(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", function () {
    if (mouseJoystickDown) { mouseJoystickDown = false; joystickEnd(); }
    lookDown = false;
  });

  // ---------- Input: look pad ----------
  var lookPad = document.getElementById("lookPad");
  var lookTouchId = null;
  var lookDown = false;
  var lastLook = { x: 0, y: 0 };
  var LOOK_SENSITIVITY = 0.006;

  function lookStart(id, x, y) {
    lookDown = true;
    lookTouchId = id;
    lastLook.x = x; lastLook.y = y;
  }
  function lookMove(x, y) {
    var dx = x - lastLook.x;
    var dy = y - lastLook.y;
    lastLook.x = x; lastLook.y = y;
    player.yaw -= dx * LOOK_SENSITIVITY;
    player.pitch -= dy * LOOK_SENSITIVITY;
    var maxPitch = Math.PI / 2 - 0.02;
    player.pitch = Math.max(-maxPitch, Math.min(maxPitch, player.pitch));
  }

  lookPad.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    lookStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  lookPad.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === lookTouchId) lookMove(t.clientX, t.clientY);
    }
  }, { passive: false });
  lookPad.addEventListener("touchend", function (e) {
    e.preventDefault();
    lookDown = false; lookTouchId = null;
  }, { passive: false });
  lookPad.addEventListener("mousedown", function (e) {
    lookStart("mouse", e.clientX, e.clientY);
  });

  // ---------- Boost ----------
  var boosting = false;
  var boostBtn = document.getElementById("boostBtn");
  boostBtn.addEventListener("touchstart", function (e) { e.preventDefault(); boosting = true; boostBtn.classList.add("active"); sfxBoost(); }, { passive: false });
  boostBtn.addEventListener("touchend", function (e) { e.preventDefault(); boosting = false; boostBtn.classList.remove("active"); }, { passive: false });
  boostBtn.addEventListener("touchcancel", function () { boosting = false; boostBtn.classList.remove("active"); });
  boostBtn.addEventListener("mousedown", function (e) { e.preventDefault(); boosting = true; boostBtn.classList.add("active"); sfxBoost(); });
  boostBtn.addEventListener("mouseup", function () { boosting = false; boostBtn.classList.remove("active"); });

  // ---------- Power hands viewmodel ----------
  var handGroup = new THREE.Group();
  camera.add(handGroup);

  var handMat = new THREE.MeshStandardMaterial({ color: 0x2a3550, roughness: 0.6, metalness: 0.2 });
  var energyMat = new THREE.MeshBasicMaterial({ color: 0x5aa0a8, transparent: true, opacity: 0.85 });

  function makeHand(sideSign) {
    var hand = new THREE.Group();
    var fist = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), handMat);
    hand.add(fist);
    var glow = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 10), energyMat.clone());
    hand.add(glow);
    var light = new THREE.PointLight(0x5aa0a8, 0.6, 3);
    hand.add(light);
    hand.position.set(sideSign * 0.2, -0.42, -0.95);
    hand.userData.glow = glow;
    hand.userData.light = light;
    hand.userData.basePos = hand.position.clone();
    handGroup.add(hand);
    return hand;
  }

  var handLeft = makeHand(-1);
  var handRight = makeHand(1);
  var handPunch = 0;

  function triggerHandPunch() {
    handPunch = 1;
  }

  // ---------- VFX: impact particles, screen shake, boost trail ----------
  var vfxGroup = new THREE.Group();
  scene.add(vfxGroup);

  var PARTICLE_POOL_SIZE = 60;
  var particlePool = [];
  var particleGeo = new THREE.SphereGeometry(0.09, 6, 6);
  for (var pi = 0; pi < PARTICLE_POOL_SIZE; pi++) {
    var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    var pMesh = new THREE.Mesh(particleGeo, pMat);
    pMesh.visible = false;
    vfxGroup.add(pMesh);
    particlePool.push({ mesh: pMesh, vel: new THREE.Vector3(), life: 0, maxLife: 1, active: false });
  }
  var nextParticleIndex = 0;

  function spawnImpactBurst(position, color, count) {
    for (var n = 0; n < count; n++) {
      var p = particlePool[nextParticleIndex];
      nextParticleIndex = (nextParticleIndex + 1) % PARTICLE_POOL_SIZE;
      p.active = true;
      p.mesh.visible = true;
      p.mesh.position.copy(position);
      p.mesh.material.color.setHex(color);
      p.mesh.material.opacity = 1;
      var speed = 3 + Math.random() * 5;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI;
      p.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      p.life = 0.3 + Math.random() * 0.3;
      p.maxLife = p.life;
    }
  }

  function updateParticles(dt) {
    for (var qi = 0; qi < particlePool.length; qi++) {
      var part = particlePool[qi];
      if (!part.active) continue;
      part.life -= dt;
      if (part.life <= 0) {
        part.active = false;
        part.mesh.visible = false;
        continue;
      }
      part.mesh.position.addScaledVector(part.vel, dt);
      part.mesh.material.opacity = Math.max(0, part.life / part.maxLife);
    }
  }

  // ---------- Debris: shard pieces flung off a hit target ----------
  var debris = [];
  function detachShardsAsDebris(group) {
    var shards = group.userData.shards;
    for (var d = 0; d < shards.length; d++) {
      var shard = shards[d];
      var worldPos = new THREE.Vector3();
      shard.getWorldPosition(worldPos);
      group.remove(shard);
      shard.position.copy(worldPos);
      scene.add(shard);
      var dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.6 + 0.2, Math.random() - 0.5).normalize();
      debris.push({
        mesh: shard,
        vel: dir.multiplyScalar(2.5 + Math.random() * 3),
        angVel: new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6),
        life: 1.2 + Math.random() * 0.5
      });
    }
    group.userData.shards = [];
  }

  function updateDebris(dt) {
    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i];
      d.life -= dt;
      if (d.life <= 0) {
        scene.remove(d.mesh);
        debris.splice(i, 1);
        continue;
      }
      d.vel.y -= 6 * dt;
      d.mesh.position.addScaledVector(d.vel, dt);
      d.mesh.rotation.x += d.angVel.x * dt;
      d.mesh.rotation.y += d.angVel.y * dt;
      d.mesh.rotation.z += d.angVel.z * dt;
    }
  }

  var SHOCKWAVE_POOL_SIZE = 8;
  var shockwavePool = [];
  var shockwaveGeo = new THREE.RingGeometry(0.4, 0.55, 20);
  for (var wi = 0; wi < SHOCKWAVE_POOL_SIZE; wi++) {
    var wMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, side: THREE.DoubleSide });
    var wMesh = new THREE.Mesh(shockwaveGeo, wMat);
    wMesh.visible = false;
    vfxGroup.add(wMesh);
    shockwavePool.push({ mesh: wMesh, life: 0, maxLife: 0.32, active: false });
  }
  var nextShockwaveIndex = 0;

  function spawnShockwave(position, color) {
    var w = shockwavePool[nextShockwaveIndex];
    nextShockwaveIndex = (nextShockwaveIndex + 1) % SHOCKWAVE_POOL_SIZE;
    w.active = true;
    w.mesh.visible = true;
    w.mesh.position.copy(position);
    w.mesh.scale.setScalar(1);
    w.mesh.material.color.setHex(color);
    w.mesh.material.opacity = 0.9;
    w.mesh.lookAt(camera.position);
    w.life = w.maxLife;
  }

  function updateShockwaves(dt) {
    for (var wi2 = 0; wi2 < shockwavePool.length; wi2++) {
      var w = shockwavePool[wi2];
      if (!w.active) continue;
      w.life -= dt;
      if (w.life <= 0) {
        w.active = false;
        w.mesh.visible = false;
        continue;
      }
      var k = 1 - w.life / w.maxLife;
      w.mesh.scale.setScalar(1 + k * 7);
      w.mesh.material.opacity = 0.9 * (1 - k);
    }
  }

  var shakeTime = 0;
  var SHAKE_DURATION = 0.12;
  var SHAKE_MAGNITUDE = 0.02;
  function triggerShake() {
    shakeTime = SHAKE_DURATION;
  }

  // ---------- Energy blasts ----------
  var BLAST_POOL_SIZE = 12;
  var blastPool = [];
  var blastGeo = new THREE.SphereGeometry(0.22, 10, 10);
  var blastMat = new THREE.MeshBasicMaterial({ color: 0x5aa0a8, transparent: true, opacity: 0.9 });
  for (var bi = 0; bi < BLAST_POOL_SIZE; bi++) {
    var blastMesh = new THREE.Mesh(blastGeo, blastMat.clone());
    var glow = new THREE.PointLight(0x5aa0a8, 0, 6);
    blastMesh.add(glow);
    blastMesh.visible = false;
    scene.add(blastMesh);
    blastPool.push({ mesh: blastMesh, light: glow, vel: new THREE.Vector3(), life: 0, active: false, trailTimer: 0 });
  }
  var nextBlastIndex = 0;

  function fireBlast(origin, direction) {
    var b = blastPool[nextBlastIndex];
    nextBlastIndex = (nextBlastIndex + 1) % BLAST_POOL_SIZE;
    b.active = true;
    b.mesh.visible = true;
    b.mesh.position.copy(origin);
    b.vel.copy(direction).multiplyScalar(BLAST_SPEED);
    b.life = BLAST_LIFETIME;
    b.light.intensity = 2.5;
    b.trailTimer = 0;
  }

  function spawnTrailParticle(position, color) {
    var p = particlePool[nextParticleIndex];
    nextParticleIndex = (nextParticleIndex + 1) % PARTICLE_POOL_SIZE;
    p.active = true;
    p.mesh.visible = true;
    p.mesh.position.copy(position);
    p.mesh.position.x += (Math.random() - 0.5) * 0.08;
    p.mesh.position.y += (Math.random() - 0.5) * 0.08;
    p.mesh.position.z += (Math.random() - 0.5) * 0.08;
    p.mesh.material.color.setHex(color);
    p.mesh.material.opacity = 0.8;
    p.vel.set(0, -0.3, 0);
    p.life = 0.18;
    p.maxLife = p.life;
  }

  function updateBlasts(dt) {
    for (var i = 0; i < blastPool.length; i++) {
      var b = blastPool[i];
      if (!b.active) continue;
      b.life -= dt;
      if (b.life <= 0) {
        b.active = false;
        b.mesh.visible = false;
        continue;
      }
      b.mesh.position.addScaledVector(b.vel, dt);

      b.trailTimer -= dt;
      if (b.trailTimer <= 0) {
        b.trailTimer = 0.018;
        spawnTrailParticle(b.mesh.position, 0x5aa0a8);
      }

      for (var ti2 = 0; ti2 < targets.length; ti2++) {
        var target = targets[ti2];
        if (target.userData.punch > 0) continue;
        if (target.position.distanceTo(b.mesh.position) < BLAST_HIT_RADIUS) {
          registerHit(target, b.mesh.position);
          b.active = false;
          b.mesh.visible = false;
          break;
        }
      }
    }
  }

  // ---------- Scoring / shooting ----------
  var score = 0;
  var shotsFired = 0;
  var shotsHit = 0;
  var crosshairEl = document.getElementById("crosshair");
  var muzzleFlashEl = document.getElementById("muzzleFlash");
  var speedLinesEl = document.getElementById("speedLines");
  var scoreLabel = document.getElementById("scoreLabel");
  var hudEl = document.getElementById("hud");
  var fireCooldownTimer = 0;

  function showScorePop() {
    var el = document.createElement("div");
    el.className = "scorePop";
    el.textContent = "+10";
    hudEl.appendChild(el);
    setTimeout(function () { hudEl.removeChild(el); }, 650);
  }

  function registerHit(target, point) {
    shotsHit++;
    score += 10;
    scoreLabel.textContent = "Score: " + score;
    crosshairEl.classList.remove("hit");
    void crosshairEl.offsetWidth;
    crosshairEl.classList.add("hit");
    showScorePop();
    sfxHit();
    var hitColor = target.userData.core.material.color.getHex();
    spawnImpactBurst(point, hitColor, 26);
    spawnShockwave(point, hitColor);
    detachShardsAsDebris(target);
    target.userData.punch = TARGET_PUNCH_DURATION;
    setTimeout(function () {
      respawnTarget(target);
    }, TARGET_PUNCH_DURATION * 1000);
  }

  function shoot() {
    if (gameOver || fireCooldownTimer > 0) return;
    fireCooldownTimer = FIRE_COOLDOWN;
    shotsFired++;

    muzzleFlashEl.classList.remove("flash");
    void muzzleFlashEl.offsetWidth;
    muzzleFlashEl.classList.add("flash");
    triggerShake();
    triggerHandPunch();
    sfxBlast();

    var dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    var origin = camera.position.clone().addScaledVector(dir, 1.2);
    fireBlast(origin, dir);
  }

  var shootBtn = document.getElementById("shootBtn");
  shootBtn.addEventListener("touchstart", function (e) { e.preventDefault(); shoot(); }, { passive: false });
  shootBtn.addEventListener("mousedown", function (e) { e.preventDefault(); shoot(); });

  // ---------- Timer / game state ----------
  var timeLeft = ROUND_SECONDS;
  var gameOver = false;
  var timeLabel = document.getElementById("timeLabel");
  var endScreen = document.getElementById("endScreen");

  var timerInterval = setInterval(function () {
    if (gameOver) return;
    timeLeft--;
    timeLabel.textContent = "Time: " + Math.max(0, timeLeft);
    if (timeLeft <= 0) {
      endRound();
    }
  }, 1000);

  function endRound() {
    gameOver = true;
    var accuracy = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
    document.getElementById("finalScore").textContent = "Final score: " + score;
    document.getElementById("finalAccuracy").textContent = "Accuracy: " + accuracy + "% (" + shotsHit + "/" + shotsFired + ")";
    endScreen.style.display = "flex";
    sfxRoundEnd();
  }

  document.getElementById("restartBtn").addEventListener("click", function () {
    score = 0;
    shotsFired = 0;
    shotsHit = 0;
    timeLeft = ROUND_SECONDS;
    gameOver = false;
    scoreLabel.textContent = "Score: 0";
    timeLabel.textContent = "Time: " + ROUND_SECONDS;
    endScreen.style.display = "none";
    targets.forEach(respawnTarget);
  });

  // ---------- Main loop ----------
  var clock = new THREE.Clock();

  function update(dt) {
    dt = Math.min(dt, 0.05);

    updateParticles(dt);
    updateShockwaves(dt);
    updateBlasts(dt);
    updateDebris(dt);
    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
    if (fireCooldownTimer > 0) {
      fireCooldownTimer = Math.max(0, fireCooldownTimer - dt);
      shootBtn.style.opacity = fireCooldownTimer > 0 ? "0.45" : "1";
    }

    handPunch = Math.max(0, handPunch - dt * 6);
    var handPulse = 1 + Math.sin(clock.elapsedTime * 4) * 0.12;
    [handLeft, handRight].forEach(function (hand) {
      hand.position.z = hand.userData.basePos.z + handPunch * 0.08;
      var s = handPulse + handPunch * 0.6;
      hand.userData.glow.scale.setScalar(s);
      hand.userData.light.intensity = 1.2 + handPunch * 3;
    });

    var t = clock.elapsedTime;
    targets.forEach(function (group, idx) {
      group.userData.shell.rotation.y += dt * 0.9;
      group.userData.shell.rotation.x += dt * 0.5;
      if (group.userData.punch > 0) {
        group.userData.punch -= dt;
        var k = Math.max(0, group.userData.punch / TARGET_PUNCH_DURATION);
        group.scale.setScalar(1 + k * 1.1);
        group.userData.core.material.emissiveIntensity = group.userData.baseCoreEmissive + k * 2;
        group.userData.shell.material.emissiveIntensity = group.userData.baseShellEmissive + k * 2;
        group.userData.light.intensity = 0.6 + k * 2;
      } else {
        group.scale.setScalar(1);
        var pulse = Math.sin(t * 3 + idx) * 0.1;
        group.userData.core.material.emissiveIntensity = group.userData.baseCoreEmissive + pulse;
        group.userData.shell.material.emissiveIntensity = group.userData.baseShellEmissive + pulse;
        group.userData.light.intensity = 0.6 + pulse;
        group.position.y += Math.sin(t * 1.5 + idx) * 0.003;
      }
    });
    rings.forEach(function (ring, idx) {
      ring.rotation.z += dt * 0.15;
    });
    clouds.forEach(function (c) {
      c.sprite.position.x += Math.cos(t * 0.05) * c.driftSpeed * dt;
      c.sprite.position.z += Math.sin(t * 0.05) * c.driftSpeed * dt;
    });

    if (gameOver) {
      camera.position.copy(player.pos);
      camera.rotation.order = "YXZ";
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
      return;
    }

    // full 3D flight: forward direction follows camera yaw+pitch
    var cosPitch = Math.cos(player.pitch);
    var forwardDir = new THREE.Vector3(
      -Math.sin(player.yaw) * cosPitch,
      Math.sin(player.pitch),
      -Math.cos(player.yaw) * cosPitch
    );
    var rightDir = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

    var speed = FLIGHT_SPEED * (boosting ? BOOST_MULTIPLIER : 1);
    var moveDelta = new THREE.Vector3();
    moveDelta.addScaledVector(forwardDir, -moveVec.y * speed * dt);
    moveDelta.addScaledVector(rightDir, moveVec.x * speed * dt);

    player.pos.add(moveDelta);
    clampToArena(player.pos);

    var moveSpeedNow = moveDelta.length();
    if (moveSpeedNow > 0.001) {
      contrailTimer -= dt;
      if (contrailTimer <= 0) {
        contrailTimer = boosting ? 0.02 : 0.06;
        var trailPos = player.pos.clone().addScaledVector(forwardDir, -0.7);
        spawnTrailParticle(trailPos, boosting ? 0xe0b34a : 0x8fa9c4);
      }
    }
    if (boosting && moveDelta.lengthSq() > 0.0001) {
      spawnImpactBurst(player.pos.clone(), 0xe0b34a, 1);
    }
    speedLinesEl.style.opacity = boosting ? "1" : "0";

    camera.position.copy(player.pos);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if (boosting) {
      camera.fov = 75 + 8;
      camera.updateProjectionMatrix();
    } else if (camera.fov !== 75) {
      camera.fov = 75;
      camera.updateProjectionMatrix();
    }

    if (shakeTime > 0) {
      var shakeAmt = (shakeTime / SHAKE_DURATION) * SHAKE_MAGNITUDE;
      camera.rotation.y += (Math.random() - 0.5) * shakeAmt;
      camera.rotation.x += (Math.random() - 0.5) * shakeAmt;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    update(dt);
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById("loading").style.display = "none";
  animate();
})();
</script>
</body>
</html>
